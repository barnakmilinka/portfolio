ize:15px; font-weight:600; color:var(--brand); width:26px; flex-shrink:0;\">04<\u002Fspan>\n            <span style=\"display:inline-flex; width:42px; height:42px; flex-shrink:0; border-radius:11px; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center;\"><i data-lucide=\"repeat\" style=\"width:21px;height:21px;\"><\u002Fi><\u002Fspan>\n            <span style=\"font-family:var(--font-display); font-size:20px; letter-spacing:-0.02em; color:var(--slate-900);\">Revizije<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"procrow reveal\" style=\"display:flex; gap:22px; align-items:center; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; box-shadow:var(--shadow-xs); padding:22px 26px;\">\n            <span style=\"font-family:var(--font-mono); font-size:15px; font-weight:600; color:var(--brand); width:26px; flex-shrink:0;\">05<\u002Fspan>\n            <span style=\"display:inline-flex; width:42px; height:42px; flex-shrink:0; border-radius:11px; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center;\"><i data-lucide=\"rocket\" style=\"width:21px;height:21px;\"><\u002Fi><\u002Fspan>\n            <span style=\"font-family:var(--font-display); font-size:20px; letter-spacing:-0.02em; color:var(--slate-900);\">Objava sajta<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SECTION 5 — NEKOLIKO STVARI O MENI -->\n      <section style=\"max-width:1120px; margin:0 auto; padding:88px 32px 84px;\">\n        <div class=\"reveal\" style=\"margin-bottom:44px;\">\n          <div class=\"md-eyebrow\" style=\"margin-bottom:14px;\">Nekoliko stvari o meni<\u002Fdiv>\n          <h2 class=\"sec-h\" style=\"font-family:var(--font-display); font-size:36px; line-height:1.1; letter-spacing:-0.03em; color:var(--slate-900); margin:0;\">Van posla<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"fact-grid\" style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:16px;\">\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">☕<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Obožavam kafu.<\u002Fspan><\u002Fdiv>\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">🎥<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Radim i UGC videe.<\u002Fspan><\u002Fdiv>\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">🤖<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Volim AI alate.<\u002Fspan><\u002Fdiv>\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">📚<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Neprestano učim.<\u002Fspan><\u002Fdiv>\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">💡<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Verujem da jednostavna rešenja daju najbolje rezultate.<\u002Fspan><\u002Fdiv>\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">🎯<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Najviše volim da radim sa malim lokalnim biznisima.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SECTION 6 — CTA -->\n      <section style=\"background:var(--surface-inverse);\">\n        <div class=\"reveal\" style=\"max-width:720px; margin:0 auto; padding:96px 32px 104px; text-align:center;\">\n          <h2 class=\"cta-h\" style=\"font-family:var(--font-display); font-size:40px; line-height:1.1; letter-spacing:-0.03em; color:#fff; margin:0 auto 20px; max-width:600px; text-wrap:balance;\">Hajde da pokažemo sve što tvoj biznis nudi.<\u002Fh2>\n          <p style=\"font-size:18px; line-height:1.65; color:var(--slate-300); margin:0 auto 34px; max-width:520px;\">Ako imaš osećaj da ljudi ne razumeju dovoljno jasno tvoje usluge, volela bih da popričamo.<\u002Fp>\n          <a class=\"btn-white\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži besplatan razgovor <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n\n  <\u002Fmain>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"background:var(--surface-inverse); color:var(--text-on-inverse); margin-top:auto;\">\n    <div style=\"max-width:1120px; margin:0 auto; padding:56px 32px 40px; display:flex; flex-wrap:wrap; gap:40px; justify-content:space-between; align-items:start;\">\n      <div style=\"max-width:320px;\">\n        <div style=\"font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:-0.03em; color:#fff; margin-bottom:12px;\">milinkadigi<span style=\"color:var(--blue-300);\">/<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:14.5px; line-height:1.65; color:var(--slate-400); margin:0;\">Izrada sajtova i digitalnog sadržaja za male biznise i brendove.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:56px; flex-wrap:wrap;\">\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--slate-500); margin-bottom:4px;\">Sajt<\u002Fdiv>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goHome }}\" style=\"color:var(--slate-300);\">Početna<\u002Fspan>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goProjekti }}\" style=\"color:var(--slate-300);\">Projekti<\u002Fspan>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goCenovnik }}\" style=\"color:var(--slate-300);\">Cenovnik<\u002Fspan>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goOnama }}\" style=\"color:var(--slate-300);\">O meni<\u002Fspan>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goUpit }}\" style=\"color:var(--slate-300);\">Kontakt<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--slate-500); margin-bottom:4px;\">Prati<\u002Fdiv>\n          <a href=\"https://www.instagram.com/barnakmilinka/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--slate-300);\">Instagram<\u002Fa>\n          <a href=\"https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=barnakmilinka@gmail.com&amp;su=Upit%20sa%20sajta\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ onCopyEmail }}\" style=\"color:var(--slate-300);\">Email<\u002Fa>\n          <a href=\"https://wa.me/38166363087\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--slate-300);\">WhatsApp<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1120px; margin:0 auto; padding:20px 32px; border-top:1px solid rgba(255,255,255,0.1); font-size:13px; color:var(--slate-500);\">© 2026 milinkadigi · Sva prava zadržana<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { page: 'home', sent: false, menuOpen: false, heroActive: 0, whyOpen: false, upitSent: false, upitError: '' };\n  go(p) { return () => { this.setState({ page: p, sent: false, menuOpen: false, whyOpen: false }); }; }\n  toggleMenu = () => { this.setState((s) => ({ menuOpen: !s.menuOpen })); };\n  onCopyEmail = (e) => {\n    try {\n      if (navigator.clipboard) {\n        e.preventDefault();\n        navigator.clipboard.writeText('barnakmilinka@gmail.com');\n        this.setState({ emailCopied: true });\n        clearTimeout(this._emailT);\n        this._emailT = setTimeout(() => this.setState({ emailCopied: false }), 2200);\n      }\n    } catch (err) {}\n  };\n  toggleWhy = () => { this.setState((s) => ({ whyOpen: !s.whyOpen })); };\n  goUpit = () => {\n    this.setState({ page: 'home', menuOpen: false, whyOpen: false }, () => {\n      const scroll = () => {\n        const el = document.getElementById('upitnik');\n        if (!el) { setTimeout(scroll, 60); return; }\n        const y = el.getBoundingClientRect().top + window.pageYOffset - 84;\n        window.scrollTo({ top: y, behavior: 'smooth' });\n      };\n      scroll();\n    });\n  };\n  WEB3FORMS_KEY = '620d15cd-ceaa-4a48-bd52-46329d85de72';\n  collectUpit() {\n    const ime = (this.uIme && this.uIme.value || '').trim();\n    const kontakt = (this.uKontakt && this.uKontakt.value || '').trim();\n    const biznis = (this.uBiznis && this.uBiznis.value || '').trim();\n    const tip = (this.uTip && this.uTip.value || '').trim();\n    const poruka = (this.uPoruka && this.uPoruka.value || '').trim();\n    return { ime, kontakt, biznis, tip, poruka };\n  }\n  onUpitSubmit = async (e) => {\n    e.preventDefault();\n    const d = this.collectUpit();\n    if (!d.ime || !d.kontakt) { this.setState({ upitError: 'Ostavi bar ime i kontakt da mogu da ti se javim.' }); return; }\n    this.setState({ upitError: '' });\n    try {\n      const res = await fetch('https://api.web3forms.com/submit', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },\n        body: JSON.stringify({\n          access_key: this.WEB3FORMS_KEY,\n          subject: 'Novi upit sa sajta — ' + d.ime,\n          from_name: d.ime,\n          Ime: d.ime, Kontakt: d.kontakt, Biznis: d.biznis, 'Šta treba': d.tip, Poruka: d.poruka,\n        }),\n      });\n      const json = await res.json();\n      if (json.success) { this.setState({ upitSent: true }); }\n      else { this.setState({ upitError: 'Nešto nije proradilo. Pošalji mi na WhatsApp — sigurno stiže.' }); }\n    } catch (err) {\n      this.setState({ upitError: 'Nešto nije proradilo. Pošalji mi na WhatsApp — sigurno stiže.' });\n    }\n  };\n  onUpitWhatsApp = () => {\n    const d = this.collectUpit();\n    let t = 'Zdravo Milina, popunila sam upitnik na sajtu.';\n    if (d.ime) t += '\\n\\nIme: ' + d.ime;\n    if (d.kontakt) t += '\\nKontakt: ' + d.kontakt;\n    if (d.biznis) t += '\\nBiznis: ' + d.biznis;\n    if (d.tip) t += '\\nŠta treba: ' + d.tip;\n    if (d.poruka) t += '\\n\\n' + d.poruka;\n    window.open('https://wa.me/38166363087?text=' + encodeURIComponent(t), '_blank');\n  };\n  componentDidMount() {\n    this.drawIcons();\n    this.setupReveal();\n    this.heroTimer = setInterval(() => {\n      if (this.state.page !== 'home') return;\n      this.setState((s) => ({ heroActive: (s.heroActive + 1) % 11 }));\n    }, 4500);\n  }\n  componentWillUnmount() { clearInterval(this.heroTimer); if (this._revObs) this._revObs.disconnect(); }\n  componentDidUpdate(prevProps, prevState) {\n    this.drawIcons();\n    if (prevState && prevState.page !== this.state.page) window.scrollTo({ top: 0 });\n    this.reapplyReveal();\n    this.setupReveal();\n  }\n  setupReveal() {\n    if (!this._revObs) {\n      this._revObs = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (en.isIntersecting) {\n            en.target.dataset.revealed = '1';\n            en.target.classList.add('reveal-in');\n            this._revObs.unobserve(en.target);\n          }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    }\n    document.querySelectorAll('.reveal:not([data-obs])').forEach((el) => {\n      el.dataset.obs = '1';\n      this._revObs.observe(el);\n    });\n  }\n  reapplyReveal() {\n    document.querySelectorAll('.reveal[data-revealed=\"1\"]').forEach((el) => el.classList.add('reveal-in'));\n  }\n  drawIcons() {\n    const go = () => { if (window.lucide) window.lucide.createIcons(); else setTimeout(go, 60); };\n    go();\n  }\n  renderVals() {\n    const p = this.state.page;\n    const col = (x) => p === x ? 'var(--brand)' : 'var(--slate-600)';\n    const projects = [\n      { slug: 'draganselidbe', url: 'https://barnakmilinka.github.io/draganselidbe/', img: 'screenshots/draganselidbe.png', tag: 'Landing · selidbe', title: 'Dragan Selidbe', problem: 'Sve je išlo preko telefona, bez mesta gde ljudi vide ponudu.', result: 'Jasna ponuda, procena cene i poziv u jednom kliku.' },\n      { slug: 'kiroprakticar', url: 'https://barnakmilinka.github.io/kiroprakticar/', img: 'screenshots/kiroprakticar.png', tag: 'Landing · kiropraktika', title: 'Kiropraktika', problem: 'Ordinaciji su trebali novi pacijenti i zakazivanje bez zvanja.', result: 'Usluge, tim i online zakazivanje, uz srpski/engleski jezik.' },\n      { slug: 'studiobella', url: 'https://barnakmilinka.github.io/studiobella/', img: 'screenshots/studiobella.png', tag: 'Landing · frizerski salon', title: 'Studio Bella', problem: 'Termini su se pisali ručno, a radovi se videli samo na Instagramu.', result: 'Galerija radova, cenovnik i online zakazivanje termina.' },\n      { slug: 'atlascenepik', url: 'https://barnakmilinka.github.io/atlascenepik/', img: 'screenshots/atlascenepik.png', tag: 'Landing · atlasoterapija', title: 'Atlas CENEPIK', problem: 'Ljudi nisu razumeli šta je tretman, pa nisu zakazivali.', result: 'Objašnjava nameštanje atlasa i vodi ka zakazivanju preko WhatsApp-a.' },\n      { slug: 'starirecept', url: 'https://barnakmilinka.github.io/starireceptidemo/', img: 'screenshots/starirecept.png', tag: 'Landing · brend', title: 'Stari Recept', problem: 'Prodaja melema samo iz ruke u ruku, bez kataloga.', result: 'Katalog proizvoda i poručivanje preko WhatsApp-a.' },\n      { slug: 'Texas', url: 'https://barnakmilinka.github.io/Texas/', img: 'screenshots/texas.png', tag: 'Landing · restoran', title: 'Texas', problem: 'Porudžbine samo preko telefona, bez jelovnika na jednom mestu.', result: 'Jelovnik, recenzije i poziv za dostavu u jednom kliku.' },\n      { slug: 'Brvnara', url: 'https://barnakmilinka.github.io/Brvnara/', img: 'screenshots/brvnara.png', tag: 'Landing · smeštaj', title: 'Brvnara Dragolj', problem: 'Gosti nisu imali gde da vide brvnaru ni da rezervišu.', result: 'Galerija, utisci i brza rezervacija preko WhatsApp-a.' },\n      { slug: 'maxima', url: 'https://barnakmilinka.github.io/maxima/', img: 'screenshots/maxima.png', tag: 'Landing · kozmetički salon', title: 'Salon Maxima', problem: 'Termini i cenovnik su se dogovarali samo porukama.', result: 'Usluge, cenovnik i online zakazivanje termina.' },\n      { slug: 'beatysalonmimi', url: 'https://barnakmilinka.github.io/beatysalonmimi/', img: 'screenshots/mimihair.png', tag: 'Landing · frizerski salon', title: 'Mimi Hair', problem: 'Salon sa 25 godina rada bez mesta koje to pokazuje.', result: 'Elegantan sajt sa uslugama, hair spa ritualima i zakazivanjem.' },\n      { slug: 'MirjanaBosnjak', url: 'https://barnakmilinka.github.io/MirjanaBosnjak/', img: 'screenshots/mirjanabosnjak.png', tag: 'Landing · terapeut', title: 'Mirjana Bošnjak', problem: 'Klijenti nisu razumeli šta hipnoterapija nudi.', result: 'Objašnjene usluge, iskustva klijenata i zakazivanje konsultacija.' },\n      { slug: 'SmartDrive021', url: 'https://barnakmilinka.github.io/SmartDrive021/', img: 'screenshots/smartdrive.png', tag: 'Landing · auto škola', title: 'Smart Drive 021', problem: 'Kandidati nisu videli cenu, vozila ni uslove obuke.', result: 'Jasna cena, tim i upis, sa prebacivanjem srpski/engleski.' },\n    ];\n    const N = projects.length;\n    const active = this.state.heroActive % N;\n    const VIS = 4; // koliko prozora iza je vidljivo\n    const heroStack = projects.map((pr, i) => {\n      const d = (i - active + N) % N; // 0 = napred\n      const url = pr.url.replace(/^https?:\\/\\//, '').replace(/\\/$/, '');\n      const webp = pr.img.replace(/\\.png$/, '.webp');\n      const visible = d <= VIS;\n      const dd = Math.min(d, VIS + 1); // dubina se ne \\u0161iri beskona\\u010dno \\u2014 prozor utone u stek\n      const tx = dd * 30;      // px u desno\n      const ty = dd * -16;     // px na gore\n      const rot = dd * 2.2;    // stepeni\n      const sc = 1 - dd * 0.055;\n      const op = d === 0 ? 1 : Math.max(0, 1 - d * 0.26);\n      const shadow = d === 0 ? '0 26px 55px -22px rgba(15,23,42,0.38)' : '0 16px 34px -20px rgba(15,23,42,0.28)';\n      const style = 'position:absolute; inset:0; display:flex; flex-direction:column; border-radius:14px; overflow:hidden; background:#fff; border:1px solid var(--border-subtle);'\n        + 'transform-origin:center center; will-change:transform,opacity;'\n        + 'transition:transform 1100ms cubic-bezier(0.4,0,0.2,1), opacity 1100ms ease;'\n        + 'box-shadow:' + shadow + ';'\n        + 'z-index:' + (N - d) + ';'\n        + 'opacity:' + (visible ? op : 0) + ';'\n        + 'pointer-events:none;'\n        + 'transform:translate3d(' + tx + 'px,' + ty + 'px,0) rotate(' + rot + 'deg) scale(' + sc.toFixed(3) + ');';\n      return { style, url, img: webp, title: pr.title, loading: 'eager' };\n    });\n    const isBlog = p.indexOf('blog') === 0;\n    const whyTopics = [\n      { slug: 'blog-guglaju', icon: 'search', title: 'Prvo te guglaju', desc: 'Šta klijent vidi kad ukuca tvoje ime na Guglu.', go: this.go('blog-guglaju') },\n      { slug: 'blog-instagram', icon: 'share-2', title: 'Društvene mreže nisu dovoljne', desc: 'Zašto profil na mrežama ne zamenjuje sajt.', go: this.go('blog-instagram') },\n      { slug: 'blog-poverenje', icon: 'shield-check', title: 'Gradi poverenje', desc: 'Kako uredan sajt govori „ozbiljan sam\".', go: this.go('blog-poverenje') },\n      { slug: 'blog-klik', icon: 'mouse-pointer-click', title: 'Jedan klik do tebe', desc: 'Kako posetioca pretvoriti u poziv ili poruku.', go: this.go('blog-klik') },\n    ];\n    const soonTitles = null;\n    const other = (slug) => whyTopics.filter((t) => t.slug !== slug);\n    return {\n      isHome: p === 'home', isProjekti: p === 'projekti', isOnama: p === 'onama', isCenovnik: p === 'cenovnik',\n      isBlogGuglaju: p === 'blog-guglaju', isBlogInstagram: p === 'blog-instagram', isBlogPoverenje: p === 'blog-poverenje', isBlogKlik: p === 'blog-klik',\n      otherTopics: other('blog-guglaju'), otherInstagram: other('blog-instagram'), otherPoverenje: other('blog-poverenje'), otherKlik: other('blog-klik'),\n      goHome: this.go('home'), goProjekti: this.go('projekti'), goOnama: this.go('onama'), goCenovnik: this.go('cenovnik'), goUpit: this.goUpit,\n      goBlogGuglaju: this.go('blog-guglaju'), goBlogInstagram: this.go('blog-instagram'), goBlogPoverenje: this.go('blog-poverenje'), goBlogKlik: this.go('blog-klik'),\n      whyTopics,\n      upitSent: this.state.upitSent, upitOpen: !this.state.upitSent, upitError: this.state.upitError,\n      refUIme: (el) => { this.uIme = el; }, refUKontakt: (el) => { this.uKontakt = el; }, refUBiznis: (el) => { this.uBiznis = el; }, refUTip: (el) => { this.uTip = el; }, refUPoruka: (el) => { this.uPoruka = el; },\n      onUpitSubmit: this.onUpitSubmit, onUpitWhatsApp: this.onUpitWhatsApp,\n      onCopyEmail: this.onCopyEmail, emailCopiedLabel: this.state.emailCopied ? '· Kopirano!' : '',\n      whyOpen: this.state.whyOpen, toggleWhy: this.toggleWhy, navWhy: isBlog ? 'var(--brand)' : 'var(--slate-600)',\n      navHome: col('home'), navProjekti: col('projekti'), navOnama: col('onama'), navCenovnik: col('cenovnik'),\n      menuOpen: this.state.menuOpen, toggleMenu: this.toggleMenu,\n      heroStack,\n      projects,\n      featured: [projects[5], projects[6], projects[9]],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
