<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"whycard\" sc-camel-on-click=\"{{ goBlogKlik }}\" style=\"cursor:pointer; display:flex; flex-direction:column;\">\n            <span style=\"display:inline-flex; width:44px; height:44px; border-radius:11px; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center; margin-bottom:18px;\"><i data-lucide=\"mouse-pointer-click\" style=\"width:22px;height:22px;\"><\u002Fi><\u002Fspan>\n            <h3 style=\"font-family:var(--font-display); font-size:18px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 8px;\">Jedan klik do tebe<\u002Fh3>\n            <p style=\"font-size:14.5px; line-height:1.6; color:var(--text-muted); margin:0 0 16px;\">Dugme „pozovi\" ili „piši na WhatsApp\" pretvara posetioca u mušteriju <b>bez čekanja i traženja.<\u002Fb><\u002Fp>\n            <span style=\"margin-top:auto; display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; color:var(--brand);\">Saznaj više <i data-lucide=\"arrow-right\" style=\"width:15px;height:15px;\"><\u002Fi><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- FEATURED WORK -->\n      <section style=\"max-width:1120px; margin:0 auto; padding:80px 32px 40px;\">\n        <div style=\"display:flex; align-items:end; justify-content:space-between; margin-bottom:32px; gap:20px; flex-wrap:wrap;\">\n          <div>\n            <div class=\"md-eyebrow\" style=\"margin-bottom:12px;\">Radovi<\u002Fdiv>\n            <h2 class=\"sec-h\" style=\"font-family:var(--font-display); font-size:34px; letter-spacing:-0.03em; color:var(--slate-900); margin:0;\">Sajtovi koji već rade<\u002Fh2>\n          <\u002Fdiv>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goProjekti }}\" style=\"color:var(--brand); font-weight:600; display:inline-flex; align-items:center; gap:6px;\">Svi projekti <i data-lucide=\"arrow-right\" style=\"width:16px;height:16px;\"><\u002Fi><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"grid-3\" style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px;\">\n          <sc-for list=\"{{ featured }}\" as=\"p\" hint-placeholder-count=\"0\">\n            <a href=\"{{ p.url }}\" target=\"_blank\" rel=\"noopener\" class=\"pcard\" style=\"background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; box-shadow:var(--shadow-sm); overflow:hidden; color:inherit; display:flex; flex-direction:column;\">\n              <div style=\"aspect-ratio:16/10; overflow:hidden; border-bottom:1px solid var(--border-subtle);\"><img class=\"pshot\" ref=\"{{ p.imgRef }}\" decoding=\"async\" loading=\"lazy\" alt=\"{{ p.title }}\" style=\"width:100%; height:100%; object-fit:cover; object-position:top;\"><\u002Fdiv>\n              <div style=\"padding:20px 20px 22px; display:flex; flex-direction:column; flex:1;\">\n                <div style=\"font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:8px;\">{{ p.tag }}<\u002Fdiv>\n                <h3 style=\"font-family:var(--font-display); font-size:20px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 7px;\">{{ p.title }}<\u002Fh3>\n                <p style=\"font-size:14px; line-height:1.55; color:var(--text-muted); margin:0 0 16px;\">{{ p.result }}<\u002Fp>\n                <span style=\"margin-top:auto; display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; color:var(--brand);\">Poseti sajt <i data-lucide=\"arrow-up-right\" style=\"width:16px;height:16px;\"><\u002Fi><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- PROCES -->\n      <section style=\"background:var(--brand-soft);\">\n      <div class=\"band-inner\" style=\"max-width:1120px; margin:0 auto; padding:80px 32px 88px;\">\n        <div style=\"text-align:center; max-width:600px; margin:0 auto 48px;\">\n          <div class=\"md-eyebrow\" style=\"margin-bottom:14px;\">Kako radimo<\u002Fdiv>\n          <h2 class=\"sec-h\" style=\"font-family:var(--font-display); font-size:34px; letter-spacing:-0.03em; color:var(--slate-900); margin:0;\">Od ideje do sajta uživo - u tri koraka<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"proc-grid\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:24px;\">\n          <div style=\"text-align:left;\">\n            <div style=\"font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--brand); margin-bottom:14px;\">01<\u002Fdiv>\n            <h3 style=\"font-family:var(--font-display); font-size:20px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 8px;\">Ispričaš mi<\u002Fh3>\n            <p style=\"font-size:15px; line-height:1.6; color:var(--text-muted); margin:0;\">Kratak razgovor o tvom biznisu, mušterijama i šta želiš da sajt radi. Bez tehničkih priča.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"text-align:left;\">\n            <div style=\"font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--brand); margin-bottom:14px;\">02<\u002Fdiv>\n            <h3 style=\"font-family:var(--font-display); font-size:20px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 8px;\">Napravim<\u002Fh3>\n            <p style=\"font-size:15px; line-height:1.6; color:var(--text-muted); margin:0;\">Dizajniram i kodiram sajt po meri, prilagođen telefonu. Pokažem ti pre nego što ide uživo.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"text-align:left;\">\n            <div style=\"font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--brand); margin-bottom:14px;\">03<\u002Fdiv>\n            <h3 style=\"font-family:var(--font-display); font-size:20px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 8px;\">Ide uživo<\u002Fh3>\n            <p style=\"font-size:15px; line-height:1.6; color:var(--text-muted); margin:0;\">Sajt je online i mušterije mogu da te nađu. Tu sam i posle ako nešto treba da se doda ili promeni.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"upitnik\" class=\"upit-grid\" style=\"max-width:760px; margin:64px auto 0; background:var(--white); border:1px solid var(--border-subtle); border-radius:24px; box-shadow:var(--shadow-md); padding:40px 40px 44px;\">\n          <sc-if value=\"{{ upitSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center; padding:24px 0;\">\n            <span style=\"display:inline-flex; width:56px; height:56px; border-radius:50%; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center; margin-bottom:18px;\"><i data-lucide=\"check\" style=\"width:28px;height:28px;\"><\u002Fi><\u002Fspan>\n            <h3 style=\"font-family:var(--font-display); font-size:24px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 10px;\">Hvala, stiglo je.<\u002Fh3>\n            <p style=\"font-size:16px; line-height:1.6; color:var(--text-muted); margin:0 auto; max-width:420px;\">Javljam ti se u roku od dana na kontakt koji si ostavila. Ako ti je hitno, piši mi direktno na WhatsApp.<\u002Fp>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ upitOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div class=\"md-eyebrow\" style=\"margin-bottom:12px;\">Upitnik<\u002Fdiv>\n            <h3 style=\"font-family:var(--font-display); font-size:26px; line-height:1.15; letter-spacing:-0.025em; color:var(--slate-900); margin:0 0 8px;\">Ispričaj mi o svom biznisu<\u002Fh3>\n            <p style=\"font-size:16px; line-height:1.6; color:var(--text-muted); margin:0 0 28px;\">Popuni par polja i javljam ti se.<\u002Fp>\n            <form sc-camel-on-submit=\"{{ onUpitSubmit }}\" style=\"display:flex; flex-direction:column; gap:18px;\">\n              <div class=\"upit-row\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:18px;\">\n                <label style=\"display:flex; flex-direction:column; gap:7px;\">\n                  <span style=\"font-size:14px; font-weight:600; color:var(--slate-700);\">Ime<\u002Fspan>\n                  <input ref=\"{{ refUIme }}\" id=\"upit-ime\" name=\"ime\" aria-label=\"Ime\" type=\"text\" placeholder=\"Kako da ti se obratim\" style=\"font-family:var(--font-body); font-size:15px; color:var(--slate-900); background:var(--white); border:1px solid var(--border-default); border-radius:10px; padding:12px 14px; outline:none;\" style-focus=\"border-color:var(--brand); box-shadow:var(--shadow-focus);\">\n                <\u002Flabel>\n                <label style=\"display:flex; flex-direction:column; gap:7px;\">\n                  <span style=\"font-size:14px; font-weight:600; color:var(--slate-700);\">Kontakt<\u002Fspan>\n                  <input ref=\"{{ refUKontakt }}\" id=\"upit-kontakt\" name=\"kontakt\" aria-label=\"Telefon ili mejl\" type=\"text\" placeholder=\"Telefon ili mejl\" style=\"font-family:var(--font-body); font-size:15px; color:var(--slate-900); background:var(--white); border:1px solid var(--border-default); border-radius:10px; padding:12px 14px; outline:none;\" style-focus=\"border-color:var(--brand); box-shadow:var(--shadow-focus);\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <label style=\"display:flex; flex-direction:column; gap:7px;\">\n                <span style=\"font-size:14px; font-weight:600; color:var(--slate-700);\">Čime se baviš<\u002Fspan>\n                <input ref=\"{{ refUBiznis }}\" id=\"upit-biznis\" name=\"biznis\" aria-label=\"Naziv biznisa\" type=\"text\" placeholder=\"Naziv biznisa ili delatnost\" style=\"font-family:var(--font-body); font-size:15px; color:var(--slate-900); background:var(--white); border:1px solid var(--border-default); border-radius:10px; padding:12px 14px; outline:none;\" style-focus=\"border-color:var(--brand); box-shadow:var(--shadow-focus);\">\n              <\u002Flabel>\n              <label style=\"display:flex; flex-direction:column; gap:7px;\">\n                <span style=\"font-size:14px; font-weight:600; color:var(--slate-700);\">Šta ti treba<\u002Fspan>\n                <sc-raw-select ref=\"{{ refUTip }}\" id=\"upit-tip\" name=\"tip\" aria-label=\"Tip sajta\" style=\"font-family:var(--font-body); font-size:15px; color:var(--slate-900); background:var(--white); border:1px solid var(--border-default); border-radius:10px; padding:12px 14px; outline:none;\" style-focus=\"border-color:var(--brand); box-shadow:var(--shadow-focus);\">\n                  <option>Nov sajt<\u002Foption>\n                  <option>Redizajn postojećeg<\u002Foption>\n                  <option>Još ne znam, hajde da popričamo<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n              <label style=\"display:flex; flex-direction:column; gap:7px;\">\n                <span style=\"font-size:14px; font-weight:600; color:var(--slate-700);\">Par reči o projektu <span style=\"font-weight:400; color:var(--text-faint);\">(opciono)<\u002Fspan><\u002Fspan>\n                <textarea ref=\"{{ refUPoruka }}\" id=\"upit-poruka\" name=\"poruka\" aria-label=\"Poruka\" rows=\"4\" placeholder=\"Šta želiš da sajt radi za tebe?\" style=\"font-family:var(--font-body); font-size:15px; color:var(--slate-900); background:var(--white); border:1px solid var(--border-default); border-radius:10px; padding:12px 14px; outline:none; resize:vertical;\" style-focus=\"border-color:var(--brand); box-shadow:var(--shadow-focus);\"><\u002Ftextarea>\n              <\u002Flabel>\n              <sc-if value=\"{{ upitError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; align-items:center; gap:9px; font-size:14px; color:#B4463F; background:color-mix(in srgb, #B4463F 8%, transparent); border-radius:10px; padding:11px 14px;\"><i data-lucide=\"alert-circle\" style=\"width:17px;height:17px;\"><\u002Fi> {{ upitError }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div class=\"upit-actions\" style=\"display:flex; gap:12px; flex-wrap:wrap; margin-top:4px;\">\n                <button type=\"submit\" class=\"btn-primary\" style=\"border:none; cursor:pointer;\">Pošalji upit <i data-lucide=\"send\" style=\"width:17px;height:17px;\"><\u002Fi><\u002Fbutton>\n                <button type=\"button\" class=\"btn-ghost\" sc-camel-on-click=\"{{ onUpitWhatsApp }}\" style=\"border:1px solid var(--border-default); background:var(--white); cursor:pointer;\"><i data-lucide=\"message-circle\" style=\"width:17px;height:17px;\"><\u002Fi> Pošalji na WhatsApp<\u002Fbutton>\n              <\u002Fdiv>\n              <p style=\"font-size:13px; line-height:1.5; color:var(--text-faint); margin:2px 0 0;\">Podaci stižu samo meni na mejl. Ne prosleđujem ih nikome.<\u002Fp>\n            <\u002Fform>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"background:var(--surface-inverse);\">\n        <div class=\"band-inner\" style=\"max-width:1120px; margin:0 auto; padding:72px 32px; display:flex; align-items:center; justify-content:space-between; gap:36px; flex-wrap:wrap;\">\n          <div style=\"max-width:560px;\">\n            <h2 class=\"band-h\" style=\"font-family:var(--font-display); font-size:40px; line-height:1.08; letter-spacing:-0.03em; color:#fff; margin:0 0 14px; text-wrap:balance;\">Spremna da tvoj biznis dobije sajt koji radi?<\u002Fh2>\n            <p style=\"font-size:18px; line-height:1.6; color:var(--slate-300); margin:0;\">Napiši mi par reči. Dogovor je besplatan <br>i javljam se u roku od&nbsp; 24 časa.<\u002Fp>\n          <\u002Fdiv>\n          <a class=\"btn-white\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži besplatan razgovor <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= BLOG: PRVO TE GUGLAJU ================= -->\n    <sc-if value=\"{{ isBlogGuglaju }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <article style=\"max-width:720px; margin:0 auto; padding:64px 32px 40px;\">\n        <span class=\"navlink\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--text-muted); margin-bottom:28px;\"><i data-lucide=\"arrow-left\" style=\"width:16px;height:16px;\"><\u002Fi> Nazad na početnu<\u002Fspan>\n        <div class=\"md-eyebrow\" style=\"margin-bottom:16px;\">Zašto sajt<\u002Fdiv>\n        <h1 style=\"font-family:var(--font-display); font-size:44px; line-height:1.08; letter-spacing:-0.035em; color:var(--slate-900); margin:0 0 28px; text-wrap:balance;\">Šta se desi kada neko čuje za tebe i ode na Gugl?<\u002Fh1>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 20px;\">Zamisli da ti prijatelj preporuči odličnog majstora, salon, ćevape ili bilo koji mali biznis.<\u002Fp>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 20px;\">Šta je prvo što uradiš pre nego što ih nazoveš?<\u002Fp>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 8px;\">Ukucaš njihovo ime na Guglu, je l' tako? Svi to radimo. Želimo da vidimo gde se nalaze, kako to izgleda, šta nude i kako da ih dobijemo. I naravno, koliko to košta.<\u002Fp>\n      <\u002Farticle>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:12px 32px 8px;\">\n        <h2 style=\"font-family:var(--font-display); font-size:28px; line-height:1.15; letter-spacing:-0.03em; color:var(--slate-900); margin:0 0 12px;\">A šta klijent vidi kada ukuca <span style=\"color:var(--brand);\">tvoje<\u002Fspan> ime?<\u002Fh2>\n        <p style=\"font-size:17px; line-height:1.6; color:var(--text-muted); margin:0 0 28px;\">U praksi se najčešće dese ova tri scenarija:<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <div style=\"display:flex; gap:18px; align-items:flex-start; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; padding:22px 24px; box-shadow:var(--shadow-sm);\">\n            <span style=\"font-family:var(--font-mono); font-size:15px; font-weight:600; color:var(--slate-400); flex-shrink:0; margin-top:2px;\">01<\u002Fspan>\n            <div>\n              <h3 style=\"font-family:var(--font-display); font-size:18px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 6px;\">Gugl ne izbaci apsolutno ništa<\u002Fh3>\n              <p style=\"font-size:15.5px; line-height:1.6; color:var(--text-muted); margin:0;\">Klijent vidi samo prazninu. Pomisli: „Hm, da li ovi uopšte još rade?\" — odustane i ode dalje.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:18px; align-items:flex-start; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; padding:22px 24px; box-shadow:var(--shadow-sm);\">\n            <span style=\"font-family:var(--font-mono); font-size:15px; font-weight:600; color:var(--slate-400); flex-shrink:0; margin-top:2px;\">02<\u002Fspan>\n            <div>\n              <h3 style=\"font-family:var(--font-display); font-size:18px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 6px;\">Gugl izbaci samo Google mapu sa bezveze slikama<\u002Fh3>\n              <p style=\"font-size:15.5px; line-height:1.6; color:var(--text-muted); margin:0;\">Možda stoji tvoja lokacija, ali su slike mutne, ponuda je nejasna, nema cena, a kontakt podaci su nepotpuni. To klijentu deluje neprofesionalno i nesigurno, pa radije izabere nekog ko deluje upeglanije.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:18px; align-items:flex-start; background:var(--brand-soft); border:1px solid color-mix(in srgb, var(--brand) 22%, transparent); border-radius:16px; padding:22px 24px;\">\n            <span style=\"font-family:var(--font-mono); font-size:15px; font-weight:600; color:var(--brand); flex-shrink:0; margin-top:2px;\">03<\u002Fspan>\n            <div>\n              <h3 style=\"font-family:var(--font-display); font-size:18px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 6px;\">Gugl izbaci tvoj moderan sajt<\u002Fh3>\n              <p style=\"font-size:15.5px; line-height:1.6; color:var(--text-body); margin:0;\">Klijent klikne, za 10 sekundi vidi tačno čime se baviš, kako mu pomažeš, koliko to okvirno košta i gde treba da klikne da te pozove. Pomisli: „Ovo su ozbiljni ljudi, sa njima hoću da radim!\"<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:36px 32px 8px;\">\n        <div style=\"border-left:3px solid var(--brand); padding:6px 0 6px 24px;\">\n          <div style=\"display:inline-flex; align-items:center; gap:9px; margin-bottom:14px;\"><i data-lucide=\"lightbulb\" style=\"width:22px;height:22px;color:var(--brand);\"><\u002Fi><span style=\"font-family:var(--font-display); font-size:22px; letter-spacing:-0.02em; color:var(--slate-900);\">Prosta računica<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:17.5px; line-height:1.65; color:var(--text-body); margin:0 0 16px;\">Dobar sajt nije tu samo da bi lepo izgledao. On je tvoj najbolji radnik koji radi 24 sata dnevno, 7 dana u nedelji.<\u002Fp>\n          <p style=\"font-size:17.5px; line-height:1.65; color:var(--text-body); margin:0 0 16px;\">Dok ti spavaš, odmaraš ili radiš svoj posao, tvoj sajt dočekuje ljude sa Gugla, objašnjava im zašto si baš ti pravi izbor i pretvara ih u kupce.<\u002Fp>\n          <p style=\"font-size:17.5px; line-height:1.65; color:var(--text-body); margin:0;\">Bez sajta, svakog dana gubiš ljude koji su već hteli da ti plate — samo nisu imali gde da vide tvoju pravu ponudu.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:960px; margin:56px auto 0; padding:0 32px 96px;\">\n        <div style=\"background:var(--surface-inverse); border-radius:24px; padding:52px 44px; text-align:center;\">\n          <h2 style=\"font-family:var(--font-display); font-size:30px; line-height:1.15; letter-spacing:-0.03em; color:#fff; margin:0 auto 24px; max-width:560px; text-wrap:balance;\">Napravimo sajt koji ti dovodi kupce.<\u002Fh2>\n          <a class=\"btn-white\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži besplatan razgovor <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:0 32px 88px;\">\n        <div style=\"font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:16px;\">Pročitaj i ovo<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\">\n          <sc-for list=\"{{ otherTopics }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <span class=\"navlink\" sc-camel-on-click=\"{{ t.go }}\" style=\"display:flex; align-items:center; gap:12px; padding:15px 0; border-top:1px solid var(--border-subtle); color:var(--slate-800);\"><i data-lucide=\"{{ t.icon }}\" style=\"width:18px;height:18px;color:var(--brand);\"><\u002Fi> <span style=\"font-family:var(--font-display); font-size:16px; letter-spacing:-0.01em;\">{{ t.title }}<\u002Fspan> <i data-lucide=\"arrow-right\" style=\"width:16px;height:16px;color:var(--text-faint); margin-left:auto;\"><\u002Fi><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= BLOG: DRUŠTVENE MREŽE ================= -->\n    <sc-if value=\"{{ isBlogInstagram }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <article style=\"max-width:720px; margin:0 auto; padding:64px 32px 40px;\">\n        <span class=\"navlink\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--text-muted); margin-bottom:28px;\"><i data-lucide=\"arrow-left\" style=\"width:16px;height:16px;\"><\u002Fi> Nazad na početnu<\u002Fspan>\n        <div class=\"md-eyebrow\" style=\"margin-bottom:16px;\">Zašto sajt<\u002Fdiv>\n        <h1 style=\"font-family:var(--font-display); font-size:44px; line-height:1.08; letter-spacing:-0.035em; color:var(--slate-900); margin:0 0 28px; text-wrap:balance;\">Zašto je opasno ako ti je Instagram jedina kuća za biznis?<\u002Fh1>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 20px;\">Priznaj, koliko puta ti se desilo da ti profil na mrežama prosto „stane\"? Uložiš trud, objaviš super stvar, a vidi je jedva šaka ljudi. Ili još gore — padne mreža na par sati i ti shvatiš da tog dana za tvoj biznis niko ne zna da postoji.<\u002Fp>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 8px;\">Oslanjati se samo na društvene mreže za zaradu je kao da praviš lokal na zemljištu koje nije tvoje, nego iznajmljeno. Nisi ti vlasnik svog profila — algoritam se promeni preko noći, a ono što nije plaćeno kroz reklamu brzo nestane na vremenskoj liniji.<\u002Fp>\n      <\u002Farticle>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:12px 32px 8px;\">\n        <h2 style=\"font-family:var(--font-display); font-size:28px; line-height:1.15; letter-spacing:-0.03em; color:var(--slate-900); margin:0 0 16px;\">Životan primer: šta se desi sa tvojom najboljom ponudom?<\u002Fh2>\n        <p style=\"font-size:17px; line-height:1.6; color:var(--text-muted); margin:0 0 16px;\">Središ ponudu za neku svoju super uslugu, napraviš odličan video i on eksplodira na mrežama! Ljudi gledaju, lajkuju, pita nekoliko njih za cenu... Sve deluje sjajno.<\u002Fp>\n        <p style=\"font-size:17px; line-height:1.6; color:var(--text-muted); margin:0 0 16px;\">Ali šta se desi već posle par dana?<\u002Fp>\n        <p style=\"font-size:17px; line-height:1.6; color:var(--text-muted); margin:0 0 16px;\">Algoritam prestane da gura tu objavu. Ti u međuvremenu izbaciš još nekoliko novih slika ili storija — i ona tvoja fenomenalna glavna ponuda ostane zakopana negde dole na profilu. Svi zaborave da uopšte postoji.<\u002Fp>\n        <div style=\"background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; padding:22px 24px; box-shadow:var(--shadow-sm); display:flex; gap:16px; align-items:flex-start; margin:4px 0 20px;\">\n          <i data-lucide=\"sparkles\" style=\"width:22px;height:22px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi>\n          <p style=\"font-size:15.5px; line-height:1.6; color:var(--text-muted); margin:0;\">Uzmi za primer kozmetički salon: snime viralan video za sjajan tretman lica, a već sledeće nedelje ga zatrpaju nove slike noktiju i pedikira. Klijent koji je hteo taj tretman lica više ne može ni da ga nađe u masi objava.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-size:17px; line-height:1.6; color:var(--text-body); margin:0; font-weight:600;\">Mreže pamte samo „šta je bilo danas\". Ono što si objavila prošle nedelje — za njih je praistorija.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:36px 32px 8px;\">\n        <div style=\"border-left:3px solid var(--brand); padding:6px 0 6px 24px;\">\n          <div style=\"display:inline-flex; align-items:center; gap:9px; margin-bottom:14px;\"><i data-lucide=\"home\" style=\"width:22px;height:22px;color:var(--brand);\"><\u002Fi><span style=\"font-family:var(--font-display); font-size:22px; letter-spacing:-0.02em; color:var(--slate-900);\">Sajt je tvoj teren<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:17.5px; line-height:1.65; color:var(--text-body); margin:0 0 16px;\">Neko vidi tvoju objavu na Instagramu ili TikTok-u i zainteresuje se. Otići će na tvoj profil, ali umesto da besomučno skroluje kroz stotine slika i traži cene po naglašenim objavama, klikne na link za sajt.<\u002Fp>\n          <p style=\"font-size:15px; font-weight:600; letter-spacing:0.02em; color:var(--slate-700); margin:0 0 12px;\">Na sajtu u roku od 10 sekundi:<\u002Fp>\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check-circle-2\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:16px; line-height:1.55; color:var(--text-body);\">Vidi tačnu ponudu i cenu za ono što ga zanima.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check-circle-2\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:16px; line-height:1.55; color:var(--text-body);\">Pogleda koje još usluge nudiš (i shvati da mu treba još nešto od tebe!).<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check-circle-2\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:16px; line-height:1.55; color:var(--text-body);\">Klikne na jedno dugme i pozove te ili zakaže.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:36px 32px 8px;\">\n        <h2 style=\"font-family:var(--font-display); font-size:28px; line-height:1.15; letter-spacing:-0.03em; color:var(--slate-900); margin:0 0 16px;\">Mreže su za privlačenje pažnje, sajt je za prodaju<\u002Fh2>\n        <p style=\"font-size:17.5px; line-height:1.65; color:var(--text-body); margin:0 0 16px;\">Instagram i TikTok su super da „upecaš\" klijenta i privučeš pažnju. Ali sajt je tvoj stalan, uredan izlog koji se ne menja kako algoritam svira.<\u002Fp>\n        <p style=\"font-size:17.5px; line-height:1.65; color:var(--text-body); margin:0;\">Tu nema skretanja pažnje na smešne klipove i konkurenciju. Tvoje najbolje usluge ne padaju u zaborav posle tri dana, već stoje na prvom mestu — spremne da svakom novom posetiocu pokažu zašto treba da izabere baš tebe.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"max-width:960px; margin:56px auto 0; padding:0 32px 96px;\">\n        <div style=\"background:var(--surface-inverse); border-radius:24px; padding:52px 44px; text-align:center;\">\n          <h2 style=\"font-family:var(--font-display); font-size:30px; line-height:1.15; letter-spacing:-0.03em; color:#fff; margin:0 auto 24px; max-width:600px; text-wrap:balance;\">Prebaci klijente sa mreža na svoj sajt.<\u002Fh2>\n          <a class=\"btn-white\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži besplatan razgovor <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:0 32px 88px;\">\n        <div style=\"font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:16px;\">Pročitaj i ovo<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\">\n          <sc-for list=\"{{ otherInstagram }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <span class=\"navlink\" sc-camel-on-click=\"{{ t.go }}\" style=\"display:flex; align-items:center; gap:12px; padding:15px 0; border-top:1px solid var(--border-subtle); color:var(--slate-800);\"><i data-lucide=\"{{ t.icon }}\" style=\"width:18px;height:18px;color:var(--brand);\"><\u002Fi> <span style=\"font-family:var(--font-display); font-size:16px; letter-spacing:-0.01em;\">{{ t.title }}<\u002Fspan> <i data-lucide=\"arrow-right\" style=\"width:16px;height:16px;color:var(--text-faint); margin-left:auto;\"><\u002Fi><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= BLOG: GRADI POVERENJE ================= -->\n    <sc-if value=\"{{ isBlogPoverenje }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <article style=\"max-width:720px; margin:0 auto; padding:64px 32px 40px;\">\n        <span class=\"navlink\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--text-muted); margin-bottom:28px;\"><i data-lucide=\"arrow-left\" style=\"width:16px;height:16px;\"><\u002Fi> Nazad na početnu<\u002Fspan>\n        <div class=\"md-eyebrow\" style=\"margin-bottom:16px;\">Zašto sajt<\u002Fdiv>\n        <h1 style=\"font-family:var(--font-display); font-size:44px; line-height:1.08; letter-spacing:-0.035em; color:var(--slate-900); margin:0 0 28px; text-wrap:balance;\">Zašto neki naplaćuju duplo više za istu stvar (i ljudi im rado plate)?<\u002Fh1>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 20px;\">Zamisli dve radnje jednu pored druge koje prodaju identičnu stvar.<\u002Fp>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 20px;\">Jedna je mračna, razbacana, nema istaknute cene i jedva čekaš da izađeš. Druga je svetla, čista, sve je složeno pod konac i tačno znaš šta koliko košta.<\u002Fp>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 20px;\">U kojoj ćeš ostaviti novac? Naravno, u drugoj — čak i ako je malo skuplja.<\u002Fp>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 8px; font-weight:600;\">Istina je jednostavna: ljudski mozak izjednačava vizuelni utisak sa kvalitetom usluge.<\u002Fp>\n      <\u002Farticle>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:12px 32px 8px;\">\n        <h2 style=\"font-family:var(--font-display); font-size:28px; line-height:1.15; letter-spacing:-0.03em; color:var(--slate-900); margin:0 0 24px;\">Kako tvoj internet nastup utiče na tvoj novčanik?<\u002Fh2>\n        <p style=\"font-size:17px; line-height:1.6; color:var(--text-muted); margin:0 0 24px;\">Kada potencijalni klijent traži nekoga da mu završi posao, on traži sigurnost. Plaši se da ne baci novac ili da ne naleti na nekog neozbiljnog.<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <div style=\"display:flex; gap:16px; align-items:flex-start; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; padding:22px 24px; box-shadow:var(--shadow-sm);\">\n            <i data-lucide=\"thumbs-down\" style=\"width:22px;height:22px;color:var(--slate-400); flex-shrink:0; margin-top:2px;\"><\u002Fi>\n            <div>\n              <h3 style=\"font-family:var(--font-display); font-size:18px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 6px;\">Bez sajta (ili sa starim, lošim sajtom)<\u002Fh3>\n              <p style=\"font-size:15.5px; line-height:1.6; color:var(--text-muted); margin:0;\">Klijent misli: „Ako im je ovako zapušten sajt, kakva im je tek usluga?\" Prva pomisao mu je da traži popust ili da ode dalje.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:16px; align-items:flex-start; background:var(--brand-soft); border:1px solid color-mix(in srgb, var(--brand) 22%, transparent); border-radius:16px; padding:22px 24px;\">\n            <i data-lucide=\"thumbs-up\" style=\"width:22px;height:22px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi>\n            <div>\n              <h3 style=\"font-family:var(--font-display); font-size:18px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 6px;\">Sa urednim, modernim sajtom<\u002Fh3>\n              <p style=\"font-size:15.5px; line-height:1.6; color:var(--text-body); margin:0;\">Klijent odmah pomisli: „Ovo su profesionalci, znaju šta rade.\" Poverenje se gradi u prvih 5 sekundi.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:36px 32px 8px;\">\n        <div style=\"border-left:3px solid var(--brand); padding:6px 0 6px 24px;\">\n          <div style=\"display:inline-flex; align-items:center; gap:9px; margin-bottom:14px;\"><i data-lucide=\"badge-check\" style=\"width:22px;height:22px;color:var(--brand);\"><\u002Fi><span style=\"font-family:var(--font-display); font-size:22px; letter-spacing:-0.02em; color:var(--slate-900);\">Uredan sajt sam opravdava tvoju cenu<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:17.5px; line-height:1.65; color:var(--text-body); margin:0;\">Dobar sajt ne služi samo da „bude lep\". On objasni tvoju vrednost pre nego što uopšte podigneš slušalicu. Kad klijent vidi da držiš do svog biznisa, daleko lakše pristaje na tvoju cenu — bez ubeđivanja i cenkanja.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:960px; margin:56px auto 0; padding:0 32px 96px;\">\n        <div style=\"background:var(--surface-inverse); border-radius:24px; padding:52px 44px; text-align:center;\">\n          <h2 style=\"font-family:var(--font-display); font-size:30px; line-height:1.15; letter-spacing:-0.03em; color:#fff; margin:0 auto 24px; max-width:600px; text-wrap:balance;\">Napravimo sajt koji opravdava tvoj kvalitet.<\u002Fh2>\n          <a class=\"btn-white\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži besplatan razgovor <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:0 32px 88px;\">\n        <div style=\"font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:16px;\">Pročitaj i ovo<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\">\n          <sc-for list=\"{{ otherPoverenje }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <span class=\"navlink\" sc-camel-on-click=\"{{ t.go }}\" style=\"display:flex; align-items:center; gap:12px; padding:15px 0; border-top:1px solid var(--border-subtle); color:var(--slate-800);\"><i data-lucide=\"{{ t.icon }}\" style=\"width:18px;height:18px;color:var(--brand);\"><\u002Fi> <span style=\"font-family:var(--font-display); font-size:16px; letter-spacing:-0.01em;\">{{ t.title }}<\u002Fspan> <i data-lucide=\"arrow-right\" style=\"width:16px;height:16px;color:var(--text-faint); margin-left:auto;\"><\u002Fi><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= BLOG: JEDAN KLIK DO TEBE ================= -->\n    <sc-if value=\"{{ isBlogKlik }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <article style=\"max-width:720px; margin:0 auto; padding:64px 32px 40px;\">\n        <span class=\"navlink\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--text-muted); margin-bottom:28px;\"><i data-lucide=\"arrow-left\" style=\"width:16px;height:16px;\"><\u002Fi> Nazad na početnu<\u002Fspan>\n        <div class=\"md-eyebrow\" style=\"margin-bottom:16px;\">Zašto sajt<\u002Fdiv>\n        <h1 style=\"font-family:var(--font-display); font-size:44px; line-height:1.08; letter-spacing:-0.035em; color:var(--slate-900); margin:0 0 28px; text-wrap:balance;\">Koliko te zapravo košta kad klijent mora da te „traži\"?<\u002Fh1>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 20px;\">Živimo u vremenu gde su ljudi ekstremno nestrpljivi. Ako klijent mora da napravi više od dva koraka da bi te dobio — ti si ga izgubio.<\u002Fp>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 20px;\">Zamisli čoveka kome hitno treba tvoja usluga. On je na telefonu, ima minut vremena i hoće odmah rešenje.<\u002Fp>\n        <p style=\"font-size:19px; line-height:1.65; color:var(--text-body); margin:0 0 8px;\">Ako mora da prekopava objave da nađe broj, pa da ga prekucava ručno u telefon, pa da razmišlja da li da piše na Viber ili WhatsApp... odustaće i otići kod onog gde je sve na jedan klik.<\u002Fp>\n      <\u002Farticle>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:12px 32px 8px;\">\n        <h2 style=\"font-family:var(--font-display); font-size:28px; line-height:1.15; letter-spacing:-0.03em; color:var(--slate-900); margin:0 0 24px;\">Kako funkcioniše sajt koji prodaje?<\u002Fh2>\n        <p style=\"font-size:17px; line-height:1.6; color:var(--text-muted); margin:0 0 24px;\">Sajt koji je napravljen kako treba skraćuje put od „samo gledam\" do „stvarno kupujem\" na svega par sekundi.<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <div style=\"display:flex; gap:16px; align-items:flex-start; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; padding:22px 24px; box-shadow:var(--shadow-sm);\">\n            <i data-lucide=\"phone-call\" style=\"width:22px;height:22px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi>\n            <div>\n              <h3 style=\"font-family:var(--font-display); font-size:18px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 6px;\">Dugme za poziv uvek pri ruci<\u002Fh3>\n              <p style=\"font-size:15.5px; line-height:1.6; color:var(--text-muted); margin:0;\">Klikne prstom i telefon odmah poziva tvoj broj. Bez prepisivanja.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:16px; align-items:flex-start; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; padding:22px 24px; box-shadow:var(--shadow-sm);\">\n            <i data-lucide=\"message-circle\" style=\"width:22px;height:22px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi>\n            <div>\n              <h3 style=\"font-family:var(--font-display); font-size:18px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 6px;\">Izbor komunikacije<\u002Fh3>\n              <p style=\"font-size:15.5px; line-height:1.6; color:var(--text-muted); margin:0;\">Jedan klik vodi direktno na WhatsApp ili Viber chat sa tobom.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:16px; align-items:flex-start; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; padding:22px 24px; box-shadow:var(--shadow-sm);\">\n            <i data-lucide=\"clipboard-check\" style=\"width:22px;height:22px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi>\n            <div>\n              <h3 style=\"font-family:var(--font-display); font-size:18px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 6px;\">Forma bez davljenja<\u002Fh3>\n              <p style=\"font-size:15.5px; line-height:1.6; color:var(--text-muted); margin:0;\">Ako želi da ti pošalje upit, ostavi samo ime i broj.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:36px 32px 8px;\">\n        <div style=\"border-left:3px solid var(--brand); padding:6px 0 6px 24px;\">\n          <div style=\"display:inline-flex; align-items:center; gap:9px; margin-bottom:14px;\"><i data-lucide=\"zap\" style=\"width:22px;height:22px;color:var(--brand);\"><\u002Fi><span style=\"font-family:var(--font-display); font-size:22px; letter-spacing:-0.02em; color:var(--slate-900);\">Bez čekanja, bez filozofije<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:17.5px; line-height:1.65; color:var(--text-body); margin:0;\">Svaki dodatni korak koji staviš između klijenta i sebe smanjuje šansu da zaradiš novac. Sačuvaj klijentu vreme, olakšaj mu kontakt i gledaj kako se broj upita povećava.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:960px; margin:56px auto 0; padding:0 32px 96px;\">\n        <div style=\"background:var(--surface-inverse); border-radius:24px; padding:52px 44px; text-align:center;\">\n          <h2 style=\"font-family:var(--font-display); font-size:30px; line-height:1.15; letter-spacing:-0.03em; color:#fff; margin:0 auto 24px; max-width:600px; text-wrap:balance;\">Olakšaj klijentima da dođu do tebe.<\u002Fh2>\n          <a class=\"btn-white\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži besplatan razgovor <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:720px; margin:0 auto; padding:0 32px 88px;\">\n        <div style=\"font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:16px;\">Pročitaj i ovo<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\">\n          <sc-for list=\"{{ otherKlik }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <span class=\"navlink\" sc-camel-on-click=\"{{ t.go }}\" style=\"display:flex; align-items:center; gap:12px; padding:15px 0; border-top:1px solid var(--border-subtle); color:var(--slate-800);\"><i data-lucide=\"{{ t.icon }}\" style=\"width:18px;height:18px;color:var(--brand);\"><\u002Fi> <span style=\"font-family:var(--font-display); font-size:16px; letter-spacing:-0.01em;\">{{ t.title }}<\u002Fspan> <i data-lucide=\"arrow-right\" style=\"width:16px;height:16px;color:var(--text-faint); margin-left:auto;\"><\u002Fi><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= PROJEKTI ================= -->\n    <sc-if value=\"{{ isProjekti }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <section style=\"max-width:1120px; margin:0 auto; padding:80px 32px 8px;\">\n        <div class=\"md-eyebrow\" style=\"margin-bottom:18px;\">Radovi<\u002Fdiv>\n        <h1 class=\"page-h1\" style=\"font-family:var(--font-display); font-size:52px; line-height:1.04; letter-spacing:-0.035em; color:var(--slate-900); margin:0 0 20px; max-width:720px; text-wrap:balance;\">Sajtovi koje sam napravila<\u002Fh1>\n        <p style=\"font-size:18px; line-height:1.6; color:var(--text-muted); max-width:600px; margin:0;\">Svaki je rešavao konkretan problem — od „nemam gde da me nađu\" do „hoću da mi zakazuju bez zvanja\". Klikni na karticu da otvoriš sajt uživo.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"max-width:1120px; margin:0 auto; padding:32px 32px 12px;\">\n        <div style=\"font-family:var(--font-mono); font-size:13px; color:var(--text-faint);\">11 projekata · svi uživo<\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:1120px; margin:0 auto; padding:12px 32px 96px;\">\n        <div class=\"grid-2\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:28px;\">\n          <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"0\">\n            <a href=\"{{ p.url }}\" target=\"_blank\" rel=\"noopener\" class=\"pcard\" style=\"background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; box-shadow:var(--shadow-sm); overflow:hidden; color:inherit; display:flex; flex-direction:column;\">\n              <div style=\"border-bottom:1px solid var(--border-subtle);\">\n                <div style=\"display:flex; align-items:center; gap:7px; padding:11px 14px; background:var(--slate-100);\"><span style=\"width:10px;height:10px;border-radius:50%;background:#E2554F;\"><\u002Fspan><span style=\"width:10px;height:10px;border-radius:50%;background:#E9B84B;\"><\u002Fspan><span style=\"width:10px;height:10px;border-radius:50%;background:#5BB863;\"><\u002Fspan><span style=\"margin-left:10px; font-family:var(--font-mono); font-size:11px; color:var(--slate-400); background:var(--white); padding:3px 12px; border-radius:6px;\">{{ p.slug }}<\u002Fspan><\u002Fdiv>\n                <div style=\"aspect-ratio:16/10; overflow:hidden;\"><img class=\"pshot\" ref=\"{{ p.imgRef }}\" decoding=\"async\" loading=\"lazy\" alt=\"{{ p.title }}\" style=\"width:100%; height:100%; object-fit:cover; object-position:top;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:24px 24px 26px; display:flex; flex-direction:column; flex:1;\">\n                <div style=\"font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:10px;\">{{ p.tag }}<\u002Fdiv>\n                <h3 style=\"font-family:var(--font-display); font-size:23px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 14px;\">{{ p.title }}<\u002Fh3>\n                <div style=\"display:flex; flex-direction:column; gap:11px; margin-bottom:18px;\">\n                  <div style=\"display:flex; gap:10px; align-items:start;\"><i data-lucide=\"circle-help\" style=\"width:17px;height:17px;color:var(--slate-400); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-muted);\"><b style=\"color:var(--slate-700); font-weight:600;\">Problem:<\u002Fb> {{ p.problem }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex; gap:10px; align-items:start;\"><i data-lucide=\"check-circle-2\" style=\"width:17px;height:17px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-muted);\"><b style=\"color:var(--slate-700); font-weight:600;\">Rešenje:<\u002Fb> {{ p.result }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"margin-top:auto; display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; color:var(--brand);\">Poseti sajt <i data-lucide=\"arrow-up-right\" style=\"width:16px;height:16px;\"><\u002Fi><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-for>\n\n          <div style=\"border:1.5px dashed var(--border-default); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 28px; color:var(--text-faint); min-height:220px;\">\n            <i data-lucide=\"plus\" style=\"width:26px;height:26px; margin-bottom:12px;\"><\u002Fi>\n            <div style=\"font-family:var(--font-display); font-size:18px; color:var(--slate-600); margin-bottom:6px;\">Tvoj sajt ovde<\u002Fdiv>\n            <div style=\"font-size:14px; line-height:1.5; max-width:240px; margin-bottom:18px;\">Sledeći projekat može biti tvoj biznis.<\u002Fdiv>\n            <a class=\"btn-primary\" style=\"font-size:14px; padding:10px 18px;\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži razgovor<\u002Fa>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= CENOVNIK ================= -->\n    <sc-if value=\"{{ isCenovnik }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <section style=\"max-width:1120px; margin:0 auto; padding:80px 32px 8px;\">\n        <div class=\"md-eyebrow\" style=\"margin-bottom:18px;\">Cenovnik<\u002Fdiv>\n        <h1 class=\"page-h1\" style=\"font-family:var(--font-display); font-size:52px; line-height:1.04; letter-spacing:-0.035em; color:var(--slate-900); margin:0 0 20px; max-width:720px; text-wrap:balance;\">Jasna cena, bez iznenađenja.<\u002Fh1>\n        <p style=\"font-size:18px; line-height:1.6; color:var(--text-muted); max-width:600px; margin:0;\">Cena zavisi od toga koliko je tvoj sajt veliki — nekome je dovoljna jedna stranica sa par sekcija, nekome treba više stranica. Zato su ovo okvirni paketi, a tačnu cenu dogovaramo u razgovoru. Bez obaveza.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"max-width:1120px; margin:0 auto; padding:44px 32px 12px;\">\n        <div class=\"belief-grid\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:24px; align-items:stretch;\">\n\n          <!-- Jednostrani -->\n          <div class=\"reveal\" style=\"display:flex; flex-direction:column; background:var(--white); border:1px solid var(--border-subtle); border-radius:20px; box-shadow:var(--shadow-xs); padding:32px 30px;\">\n            <div style=\"font-family:var(--font-display); font-size:21px; letter-spacing:-0.02em; color:var(--slate-900); margin-bottom:6px;\">Jednostrani sajt<\u002Fdiv>\n            <p style=\"font-size:14.5px; line-height:1.55; color:var(--text-muted); margin:0 0 22px;\">Za biznis kome treba jedno jasno mesto — sve na jednoj stranici.<\u002Fp>\n            <div style=\"display:flex; align-items:baseline; gap:6px; margin-bottom:24px;\">\n              <span style=\"font-family:var(--font-display); font-size:34px; font-weight:600; letter-spacing:-0.02em; color:var(--slate-900);\">od 500<\u002Fspan>\n              <span style=\"font-size:15px; color:var(--text-muted);\">€<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:12px; margin-bottom:26px;\">\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Do 6 sekcija (usluge, galerija, kontakt...)<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Dugme za poziv i WhatsApp<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Galerija radova<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Prilagođeno telefonu<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <a class=\"btn-ghost\" style=\"margin-top:auto; justify-content:center;\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži razgovor<\u002Fa>\n          <\u002Fdiv>\n\n          <!-- Višestrani (highlight) -->\n          <div class=\"reveal\" style=\"position:relative; display:flex; flex-direction:column; background:var(--white); border:1.5px solid var(--brand); border-radius:20px; box-shadow:var(--shadow-lg); padding:32px 30px;\">\n            <div style=\"position:absolute; top:-13px; left:30px; background:var(--brand); color:#fff; font-size:12px; font-weight:600; letter-spacing:0.04em; padding:5px 13px; border-radius:999px;\">Najčešći izbor<\u002Fdiv>\n            <div style=\"font-family:var(--font-display); font-size:21px; letter-spacing:-0.02em; color:var(--slate-900); margin-bottom:6px;\">Višestrani sajt<\u002Fdiv>\n            <p style=\"font-size:14.5px; line-height:1.55; color:var(--text-muted); margin:0 0 22px;\">Za biznis sa više usluga kome treba nekoliko stranica.<\u002Fp>\n            <div style=\"display:flex; align-items:baseline; gap:6px; margin-bottom:24px;\">\n              <span style=\"font-family:var(--font-display); font-size:34px; font-weight:600; letter-spacing:-0.02em; color:var(--slate-900);\">od 700<\u002Fspan>\n              <span style=\"font-size:15px; color:var(--text-muted);\">€<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:12px; margin-bottom:26px;\">\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Više stranica (početna, usluge, o nama, kontakt...)<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Sve iz jednostranog paketa<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Cenovnik ili katalog usluga<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Online zakazivanje ili forma za upit<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <a class=\"btn-primary\" style=\"margin-top:auto; justify-content:center;\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži razgovor<\u002Fa>\n          <\u002Fdiv>\n\n          <!-- Po meri -->\n          <div class=\"reveal\" style=\"display:flex; flex-direction:column; background:var(--white); border:1px solid var(--border-subtle); border-radius:20px; box-shadow:var(--shadow-xs); padding:32px 30px;\">\n            <div style=\"font-family:var(--font-display); font-size:21px; letter-spacing:-0.02em; color:var(--slate-900); margin-bottom:6px;\">Sajt po meri<\u002Fdiv>\n            <p style=\"font-size:14.5px; line-height:1.55; color:var(--text-muted); margin:0 0 22px;\">Za veće projekte sa posebnim funkcijama i sadržajem.<\u002Fp>\n            <div style=\"display:flex; align-items:baseline; gap:6px; margin-bottom:24px;\">\n              <span style=\"font-family:var(--font-display); font-size:34px; font-weight:600; letter-spacing:-0.02em; color:var(--slate-900);\">od 1.200<\u002Fspan>\n              <span style=\"font-size:15px; color:var(--text-muted);\">€<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:12px; margin-bottom:26px;\">\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Neograničen broj stranica<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Višejezičnost (srpski / engleski)<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:11px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:18px;height:18px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi><span style=\"font-size:14.5px; line-height:1.5; color:var(--text-body);\">Posebne funkcije po tvojoj želji<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <a class=\"btn-ghost\" style=\"margin-top:auto; justify-content:center;\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži razgovor<\u002Fa>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.55; color:var(--text-faint); margin:22px 0 0; text-align:center;\">Cene su okvirne i zavise od obima i delatnosti. Tačnu ponudu dobijaš nakon kratkog razgovora.<\u002Fp>\n        <div style=\"display:flex; gap:12px; align-items:flex-start; max-width:620px; margin:18px auto 0; background:var(--white); border:1px solid var(--border-subtle); border-radius:14px; padding:16px 20px;\">\n          <i data-lucide=\"globe\" style=\"width:20px;height:20px;color:var(--brand); flex-shrink:0; margin-top:2px;\"><\u002Fi>\n          <p style=\"font-size:14.5px; line-height:1.6; color:var(--text-muted); margin:0;\">Cena ne uključuje domen — on se plaća posebno, obično oko <b style=\"color: var(--slate-800); font-weight: 600;\">15 € godišnje<\u002Fb>. <br><b style=\"color: var(--slate-800); font-weight: 600;\">Hosting je besplatan.<\u002Fb><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Dodaci -->\n      <section style=\"max-width:1120px; margin:0 auto; padding:64px 32px 8px;\">\n        <div class=\"reveal\" style=\"max-width:560px; margin-bottom:28px;\">\n          <div class=\"md-eyebrow\" style=\"margin-bottom:14px;\">Dodaci<\u002Fdiv>\n          <h2 class=\"sec-h\" style=\"font-family:var(--font-display); font-size:30px; line-height:1.12; letter-spacing:-0.03em; color:var(--slate-900); margin:0;\">Dodaj šta ti treba, plati samo to<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"grid-2\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px;\">\n          <div class=\"reveal dodcard\" style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--white); border:1px solid var(--border-subtle); border-radius:14px; padding:18px 24px;\">\n            <span style=\"display:flex; align-items:center; gap:13px;\"><i data-lucide=\"file-plus\" style=\"width:20px;height:20px;color:var(--brand);\"><\u002Fi><span style=\"font-size:15.5px; color:var(--slate-800);\">Dodatna stranica<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--slate-900); white-space:nowrap;\">od 60 €<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"reveal dodcard\" style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--white); border:1px solid var(--border-subtle); border-radius:14px; padding:18px 24px;\">\n            <span style=\"display:flex; align-items:center; gap:13px;\"><i data-lucide=\"languages\" style=\"width:20px;height:20px;color:var(--brand);\"><\u002Fi><span style=\"font-size:15.5px; color:var(--slate-800);\">Dodatni jezik na sajtu<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--slate-900); white-space:nowrap;\">od 150 €<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"reveal dodcard\" style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--white); border:1px solid var(--border-subtle); border-radius:14px; padding:18px 24px;\">\n            <span style=\"display:flex; align-items:center; gap:13px;\"><i data-lucide=\"mail-check\" style=\"width:20px;height:20px;color:var(--brand);\"><\u002Fi><span style=\"font-size:15.5px; color:var(--slate-800);\">Napredna kontakt forma<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--slate-900); white-space:nowrap;\">po dogovoru<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"reveal dodcard\" style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--white); border:1px solid var(--border-subtle); border-radius:14px; padding:18px 24px;\">\n            <span style=\"display:flex; align-items:center; gap:13px;\"><i data-lucide=\"search\" style=\"width:20px;height:20px;color:var(--brand);\"><\u002Fi><span style=\"font-size:15.5px; color:var(--slate-800);\">Osnovni SEO<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--slate-900); white-space:nowrap;\">od 85 €<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Uvek uključeno -->\n      <section style=\"max-width:1120px; margin:0 auto; padding:56px 32px 8px;\">\n        <div class=\"reveal\" style=\"background:var(--brand-soft); border:1px solid color-mix(in srgb, var(--brand) 18%, transparent); border-radius:20px; padding:36px 34px;\">\n          <div style=\"font-family:var(--font-display); font-size:19px; letter-spacing:-0.02em; color:var(--slate-900); margin-bottom:20px;\">Svaki sajt uključuje<\u002Fdiv>\n          <div class=\"fact-grid\" style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:14px 32px;\">\n            <div style=\"display:flex; gap:11px; align-items:center;\"><i data-lucide=\"smartphone\" style=\"width:19px;height:19px;color:var(--brand);\"><\u002Fi><span style=\"font-size:15.5px; color:var(--text-body);\">Prilagođeno telefonu i računaru<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:11px; align-items:center;\"><i data-lucide=\"mouse-pointer-click\" style=\"width:19px;height:19px;color:var(--brand);\"><\u002Fi><span style=\"font-size:15.5px; color:var(--text-body);\">Kontakt na jedan klik<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:11px; align-items:center;\"><i data-lucide=\"rocket\" style=\"width:19px;height:19px;color:var(--brand);\"><\u002Fi><span style=\"font-size:15.5px; color:var(--text-body);\">Pomoć oko objave sajta<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:11px; align-items:center;\"><i data-lucide=\"repeat\" style=\"width:19px;height:19px;color:var(--brand);\"><\u002Fi><span style=\"font-size:15.5px; color:var(--text-body);\">2 kruga revizija uključena<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- CTA -->\n      <section style=\"background:var(--surface-inverse); margin-top:80px;\">\n        <div class=\"reveal\" style=\"max-width:720px; margin:0 auto; padding:88px 32px 96px; text-align:center;\">\n          <h2 class=\"cta-h\" style=\"font-family:var(--font-display); font-size:38px; line-height:1.1; letter-spacing:-0.03em; color:#fff; margin:0 auto 18px; max-width:560px; text-wrap:balance;\">Nisi sigurna koji paket ti treba?<\u002Fh2>\n          <p style=\"font-size:18px; line-height:1.65; color:var(--slate-300); margin:0 auto 32px; max-width:500px;\">Javi mi čime se baviš i dogovorimo se šta ti tačno treba. Razgovor je besplatan i bez obaveza.<\u002Fp>\n          <a class=\"btn-white\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži besplatan razgovor <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= O MENI ================= -->\n    <sc-if value=\"{{ isOnama }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n\n      <!-- SECTION 1 — HERO -->\n      <section class=\"onama-hero\" style=\"max-width:1120px; margin:0 auto; padding:88px 32px 72px; display:grid; grid-template-columns:1.02fr 0.98fr; gap:64px; align-items:center;\">\n        <div class=\"fadein\">\n          <div class=\"md-eyebrow\" style=\"margin-bottom:20px;\">O meni<\u002Fdiv>\n          <h1 class=\"onama-h1\" style=\"font-family:var(--font-display); font-size:56px; line-height:1.02; letter-spacing:-0.035em; color:var(--slate-900); margin:0 0 20px; text-wrap:balance;\">Zdravo, <br>ja sam Milinka.<\u002Fh1>\n          <p style=\"font-family:var(--font-display); font-size:22px; font-weight:500; line-height:1.3; letter-spacing:-0.02em; color:var(--brand); margin:0 0 26px;\">Kako je sve počelo<\u002Fp>\n          <p style=\"font-size:18px; line-height:1.7; color:var(--text-muted); max-width:440px; margin:0;\">Ne pravim sajtove zato što je to popularno. Pravim ih zbog jedne male situacije koja mi je otvorila oči. <br>Evo cele priče.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"onama-portrait fadein\" style=\"position:relative;\">\n          <div style=\"position:absolute; inset:14px -14px -14px 14px; border:1.5px solid color-mix(in srgb, var(--brand) 30%, transparent); border-radius:26px; z-index:0;\"><\u002Fdiv>\n          <div style=\"position:relative; z-index:1; aspect-ratio:4/5; border-radius:24px; overflow:hidden; box-shadow:0 30px 60px -22px rgba(15,23,42,0.32), 0 8px 20px -8px rgba(15,23,42,0.16);\">\n            <image-slot id=\"portret-milinka\" shape=\"rect\" placeholder=\"Prevuci svoju fotografiju ovde\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SECTION 2 — STORY -->\n      <section style=\"background:var(--white); border-top:1px solid var(--border-subtle); border-bottom:1px solid var(--border-subtle);\">\n      <div style=\"max-width:680px; margin:0 auto; padding:88px 32px 92px;\">\n        <div class=\"reveal\" style=\"margin-bottom:44px;\">\n          <div class=\"md-eyebrow\" style=\"margin-bottom:14px;\">Priča<\u002Fdiv>\n          <h2 class=\"story-h\" style=\"font-family:var(--font-display); font-size:36px; line-height:1.1; letter-spacing:-0.03em; color:var(--slate-900); margin:0; text-wrap:balance;\">Otkud ja u web svetu?<\u002Fh2>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:22px;\">\n          <p class=\"reveal story-lead\" style=\"font-size:21px; line-height:1.6; color:var(--slate-900); margin:0; font-weight:500;\">Sve je počelo davne 2016. godine kada sam pogledala prvi tutorijal za Excel na YouTube-u.<\u002Fp>\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-muted); margin:0;\">Šalim se. 😄 Neću da ti pišem svoje memoare.<\u002Fp>\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-body); margin:0;\">U digitalni svet sam zapravo ušla kroz UGC. Radila sam videe za različite brendove i shvatila koliko dobra reklama može da privuče pažnju.<\u002Fp>\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-body); margin:0;\">Ali onda sam shvatila još nešto.<\u002Fp>\n          <blockquote class=\"reveal\" style=\"margin:8px 0; padding:4px 0 4px 26px; border-left:3px solid var(--brand);\">\n            <p style=\"font-family:var(--font-display); font-size:24px; line-height:1.32; letter-spacing:-0.02em; color:var(--slate-900); margin:0; font-weight:500;\">Šta se dešava kada reklama odradi svoj posao, <br>a potencijalni klijent i dalje ne zna šta sve nudiš?<\u002Fp>\n          <\u002Fblockquote>\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-body); margin:0;\">Odgovor sam dobila sasvim slučajno.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"reveal\" style=\"height:1px; background:var(--border-subtle); margin:44px 0;\"><\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:20px;\">\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-body); margin:0;\">Brat me je jednog dana pitao da li znam nekoga ko radi tretmane za pubertetske akne. Bez razmišljanja preporučila sam svoju kozmetičarku Draganu, kod koje idem godinama.<\u002Fp>\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-muted); margin:0;\">Njegova reakcija me je iznenadila.<\u002Fp>\n          <p class=\"reveal\" style=\"font-family:var(--font-display); font-size:26px; line-height:1.25; letter-spacing:-0.02em; color:var(--brand); margin:2px 0;\">„A ona i to radi?\"<\u002Fp>\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-muted); margin:0;\">Kasnije sam to prepričala sestri. Ona je rekla isto.<\u002Fp>\n          <p class=\"reveal\" style=\"font-family:var(--font-display); font-size:26px; line-height:1.25; letter-spacing:-0.02em; color:var(--brand); margin:2px 0;\">„Mislila sam da radi samo nokte i depilaciju.\"<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"reveal\" style=\"height:1px; background:var(--border-subtle); margin:44px 0;\"><\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:20px;\">\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-body); margin:0;\">Otvorila sam Draganin Instagram i odmah mi je bilo jasno zašto. Najviše je bilo fotografija noktiju i naziva tretmana koje ni ja nisam razumela bez Google-a.<\u002Fp>\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-body); margin:0;\">Tada sam shvatila nešto što mi je potpuno promenilo pogled na male biznise.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"reveal\" style=\"margin:36px 0; background:var(--surface-inverse); border-radius:22px; padding:44px 40px; text-align:center;\">\n          <p style=\"font-family:var(--font-display); font-size:30px; line-height:1.2; letter-spacing:-0.025em; color:#fff; margin:0; text-wrap:balance;\">Ljudi su znali za nju.<br><span style=\"color:var(--blue-300);\">Ali nisu znali šta sve radi.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:20px;\">\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-muted); margin:0;\">I pomislila sam...<\u002Fp>\n          <blockquote class=\"reveal\" style=\"margin:0; padding:4px 0 4px 26px; border-left:3px solid var(--brand);\">\n            <p style=\"font-family:var(--font-display); font-size:22px; line-height:1.35; letter-spacing:-0.02em; color:var(--slate-900); margin:0; font-weight:500;\">Koliko još malih biznisa svakog dana gubi klijente samo zato što njihove usluge nisu jasno predstavljene?<\u002Fp>\n          <\u002Fblockquote>\n        <\u002Fdiv>\n\n        <div class=\"reveal\" style=\"height:1px; background:var(--border-subtle); margin:44px 0;\"><\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:20px;\">\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-body); margin:0;\">Tako sam počela da učim web dizajn. Upisala sam kurs, provela mnogo sati učeći (i, iskreno, nervirajući se 😄), pravila demo projekte i usavršavala proces.<\u002Fp>\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-body); margin:0;\">Danas pravim sajtove koji imaju jedan cilj:<\u002Fp>\n          <p class=\"reveal story-lead\" style=\"font-size:21px; line-height:1.6; color:var(--slate-900); margin:0; font-weight:500;\">da ljudi za nekoliko minuta razumeju čime se bavite, koje probleme rešavate i zašto bi trebalo da izaberu baš vas.<\u002Fp>\n          <p class=\"reveal\" style=\"font-size:18px; line-height:1.75; color:var(--text-muted); margin:0;\">Jer lep sajt je super. Ali mnogo je važnije da klijenti konačno razumeju šta sve nudite.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SECTION 3 — U ŠTA VERUJEM -->\n      <section style=\"max-width:1120px; margin:0 auto; padding:88px 32px 76px;\">\n        <div class=\"reveal\" style=\"max-width:600px; margin-bottom:48px;\">\n          <div class=\"md-eyebrow\" style=\"margin-bottom:14px;\">U šta verujem<\u002Fdiv>\n          <h2 class=\"sec-h\" style=\"font-family:var(--font-display); font-size:36px; line-height:1.1; letter-spacing:-0.03em; color:var(--slate-900); margin:0; text-wrap:balance;\">Tri stvari koje me vode u svakom projektu<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"belief-grid\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:24px;\">\n          <div class=\"beliefcard reveal\" style=\"display:flex; flex-direction:column;\">\n            <span style=\"display:inline-flex; width:46px; height:46px; border-radius:12px; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center; margin-bottom:22px;\"><i data-lucide=\"users\" style=\"width:23px;height:23px;\"><\u002Fi><\u002Fspan>\n            <p style=\"font-size:18px; line-height:1.55; color:var(--slate-900); margin:0; font-weight:500;\">Ljudi ne mogu da postanu tvoji klijenti ako ne razumeju šta nudiš.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"beliefcard reveal\" style=\"display:flex; flex-direction:column;\">\n            <span style=\"display:inline-flex; width:46px; height:46px; border-radius:12px; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center; margin-bottom:22px;\"><i data-lucide=\"message-square-text\" style=\"width:23px;height:23px;\"><\u002Fi><\u002Fspan>\n            <p style=\"font-size:18px; line-height:1.55; color:var(--slate-900); margin:0; font-weight:500;\">Dobar sajt ne služi samo da lepo izgleda. On treba da odgovori na pitanja pre nego što ih klijent postavi.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"beliefcard reveal\" style=\"display:flex; flex-direction:column;\">\n            <span style=\"display:inline-flex; width:46px; height:46px; border-radius:12px; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center; margin-bottom:22px;\"><i data-lucide=\"target\" style=\"width:23px;height:23px;\"><\u002Fi><\u002Fspan>\n            <p style=\"font-size:18px; line-height:1.55; color:var(--slate-900); margin:0; font-weight:500;\">Moj cilj nije da napravim još jedan lep sajt. Moj cilj je da tvoj biznis bude jasan.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SECTION 4 — MOJ PROCES -->\n      <section style=\"background:var(--brand-soft);\">\n      <div style=\"max-width:820px; margin:0 auto; padding:84px 32px 88px;\">\n        <div class=\"reveal\" style=\"margin-bottom:48px;\">\n          <div class=\"md-eyebrow\" style=\"margin-bottom:14px;\">Moj proces<\u002Fdiv>\n          <h2 class=\"sec-h\" style=\"font-family:var(--font-display); font-size:36px; line-height:1.1; letter-spacing:-0.03em; color:var(--slate-900); margin:0;\">Kako izgleda rad sa mnom<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:14px;\">\n          <div class=\"procrow reveal\" style=\"display:flex; gap:22px; align-items:center; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; box-shadow:var(--shadow-xs); padding:22px 26px;\">\n            <span style=\"font-family:var(--font-mono); font-size:15px; font-weight:600; color:var(--brand); width:26px; flex-shrink:0;\">01<\u002Fspan>\n            <span style=\"display:inline-flex; width:42px; height:42px; flex-shrink:0; border-radius:11px; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center;\"><i data-lucide=\"message-circle\" style=\"width:21px;height:21px;\"><\u002Fi><\u002Fspan>\n            <span style=\"font-family:var(--font-display); font-size:20px; letter-spacing:-0.02em; color:var(--slate-900);\">Razgovor<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"procrow reveal\" style=\"display:flex; gap:22px; align-items:center; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; box-shadow:var(--shadow-xs); padding:22px 26px;\">\n            <span style=\"font-family:var(--font-mono); font-size:15px; font-weight:600; color:var(--brand); width:26px; flex-shrink:0;\">02<\u002Fspan>\n            <span style=\"display:inline-flex; width:42px; height:42px; flex-shrink:0; border-radius:11px; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center;\"><i data-lucide=\"search\" style=\"width:21px;height:21px;\"><\u002Fi><\u002Fspan>\n            <span style=\"font-family:var(--font-display); font-size:20px; letter-spacing:-0.02em; color:var(--slate-900);\">Upoznajem tvoj biznis<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"procrow reveal\" style=\"display:flex; gap:22px; align-items:center; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; box-shadow:var(--shadow-xs); padd
