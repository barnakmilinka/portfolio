document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eutral slate ramp for real UI needs. */\n:root {\n  /* --- Brand base (from guide) --- */\n  --cloud-white: #F8FAFC;   /* Pozadina — very light gray-blue, easy on the eyes */\n  --digital-cobalt: #0052FF; /* Dominantna — strong, vibrant blue accent */\n  --slate-dark: #1E293B;     /* Tekst — dark slate instead of pure black */\n  --soft-gray: #E2E8F0;      /* Akcenat — light gray for detail */\n\n  /* --- Blue ramp (built around Digital Cobalt) --- */\n  --blue-50:  #EBF1FF;\n  --blue-100: #D6E3FF;\n  --blue-200: #ADC6FF;\n  --blue-300: #7FA3FF;\n  --blue-400: #4A78FF;\n  --blue-500: #0052FF;  /* = Digital Cobalt */\n  --blue-600: #0042CC;\n  --blue-700: #00329B;\n  --blue-800: #04246B;\n  --blue-900: #071A4A;\n\n  /* --- Slate neutral ramp --- */\n  --slate-50:  #F8FAFC;  /* = Cloud White */\n  --slate-100: #F1F5F9;\n  --slate-200: #E2E8F0;  /* = Soft Gray */\n  --slate-300: #CBD5E1;\n  --slate-400: #94A3B8;\n  --slate-500: #64748B;\n  --slate-600: #475569;\n  --slate-700: #334155;\n  --slate-800: #1E293B;  /* = Slate Dark */\n  --slate-900: #0F172A;\n  --white: #FFFFFF;\n\n  /* --- Semantic status (kept in the cool/desaturated family) --- */\n  --success: #0EA371;\n  --success-soft: #DFF5EC;\n  --warning: #C77A00;\n  --warning-soft: #FBEDD6;\n  --danger: #E5484D;\n  --danger-soft: #FBE4E5;\n  --info: var(--blue-500);\n  --info-soft: var(--blue-50);\n\n  /* --- Semantic aliases --- */\n  --bg-app: var(--cloud-white);\n  --surface-card: var(--white);\n  --surface-sunken: var(--slate-100);\n  --surface-inverse: var(--slate-900);\n\n  --border-subtle: var(--slate-200);\n  --border-default: var(--slate-300);\n  --border-strong: var(--slate-400);\n\n  --text-strong: var(--slate-900);\n  --text-body: var(--slate-800);\n  --text-muted: var(--slate-500);\n  --text-faint: var(--slate-400);\n  --text-on-brand: #FFFFFF;\n  --text-on-inverse: var(--slate-100);\n\n  --brand: var(--digital-cobalt);\n  --brand-hover: var(--blue-600);\n  --brand-active: var(--blue-700);\n  --brand-soft: var(--blue-50);\n  --brand-ring: color-mix(in srgb, var(--digital-cobalt) 32%, transparent);\n  --link: var(--digital-cobalt);\n  --link-hover: var(--blue-700);\n}\n<\u002Fstyle>\n<style>/* Milinkadigi — Typography tokens.\n   Space Grotesk for headings (geometric, precise).\n   Plus Jakarta Sans for body (clean, airy).\n   JetBrains Mono for code/numeric detail. */\n:root {\n  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;\n  --font-body: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* Type scale (1.25 major-third-ish, tuned) */\n  --text-2xs: 0.6875rem;  /* 11px */\n  --text-xs:  0.75rem;    /* 12px */\n  --text-sm:  0.875rem;   /* 14px */\n  --text-base:1rem;       /* 16px */\n  --text-lg:  1.125rem;   /* 18px */\n  --text-xl:  1.375rem;   /* 22px */\n  --text-2xl: 1.75rem;    /* 28px */\n  --text-3xl: 2.25rem;    /* 36px */\n  --text-4xl: 3rem;       /* 48px */\n  --text-5xl: 4rem;       /* 64px */\n  --text-6xl: 5.25rem;    /* 84px */\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n\n  --leading-tight: 1.08;\n  --leading-snug: 1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.7;\n\n  --tracking-tight: -0.03em;\n  --tracking-snug: -0.015em;\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;\n  --tracking-caps: 0.12em;   /* for uppercase eyebrows/labels */\n}\n<\u002Fstyle>\n<style>/* Milinkadigi — Spacing, radius, shadow, motion, layout tokens. */\n:root {\n  /* Spacing — 4px base grid */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 3rem;      /* 48 */\n  --space-8: 4rem;      /* 64 */\n  --space-9: 6rem;      /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Radius — soft, generous corners for a friendly-but-precise feel */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-2xl: 32px;\n  --radius-pill: 999px;\n\n  /* Border widths */\n  --border-hair: 1px;\n  --border-thick: 1.5px;\n\n  /* Shadows — cool, soft, low-contrast. Tinted with slate, never pure black. */\n  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.06);\n  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);\n  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);\n  --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.10), 0 4px 8px rgba(15, 23, 42, 0.05);\n  --shadow-xl: 0 24px 56px rgba(15, 23, 42, 0.14), 0 8px 16px rgba(15, 23, 42, 0.06);\n  --shadow-brand: 0 8px 24px rgba(0, 82, 255, 0.24);\n  --shadow-focus: 0 0 0 3px var(--brand-ring);\n\n  /* Motion — quick, calm, no bounce */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 180ms; /* @kind other */\n  --dur-slow: 280ms; /* @kind other */\n\n  /* Layout */\n  --container-sm: 640px;\n  --container-md: 820px;\n  --container-lg: 1080px;\n  --container-xl: 1200px;\n}\n<\u002Fstyle>\n<style>/* Milinkadigi — base element defaults + a few utility helpers.\n   Kept minimal; components own their own styling. */\n:root {\n  color-scheme: light;\n}\nbody {\n  margin: 0;\n  background: var(--bg-app);\n  color: var(--text-body);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  font-weight: var(--weight-bold);\n  margin: 0;\n  text-wrap: balance;\n}\np { text-wr \n  font-weight: 700;\n  font-display: swap;\n  src: url(\"13f4630b-5ab0-417b-88ff-062a08600f89\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Milinkadigi — Color tokens. Soft Blue Minimalism.\n   Base palette from the visual identity guide, extended with a tonal\n   blue ramp and neutral slate ramp for real UI needs. */\n:root {\n  /* --- Brand base (from guide) --- */\n  --cloud-white: #F8FAFC;   /* Pozadina — very light gray-blue, easy on the eyes */\n  --digital-cobalt: #0052FF; /* Dominantna — strong, vibrant blue accent */\n  --slate-dark: #1E293B;     /* Tekst — dark slate instead of pure black */\n  --soft-gray: #E2E8F0;      /* Akcenat — light gray for detail */\n\n  /* --- Blue ramp (built around Digital Cobalt) --- */\n  --blue-50:  #EBF1FF;\n  --blue-100: #D6E3FF;\n  --blue-200: #ADC6FF;\n  --blue-300: #7FA3FF;\n  --blue-400: #4A78FF;\n  --blue-500: #0052FF;  /* = Digital Cobalt */\n  --blue-600: #0042CC;\n  --blue-700: #00329B;\n  --blue-800: #04246B;\n  --blue-900: #071A4A;\n\n  /* --- Slate neutral ramp --- */\n  --slate-50:  #F8FAFC;  /* = Cloud White */\n  --slate-100: #F1F5F9;\n  --slate-200: #E2E8F0;  /* = Soft Gray */\n  --slate-300: #CBD5E1;\n  --slate-400: #94A3B8;\n  --slate-500: #64748B;\n  --slate-600: #475569;\n  --slate-700: #334155;\n  --slate-800: #1E293B;  /* = Slate Dark */\n  --slate-900: #0F172A;\n  --white: #FFFFFF;\n\n  /* --- Semantic status (kept in the cool/desaturated family) --- */\n  --success: #0EA371;\n  --success-soft: #DFF5EC;\n  --warning: #C77A00;\n  --warning-soft: #FBEDD6;\n  --danger: #E5484D;\n  --danger-soft: #FBE4E5;\n  --info: var(--blue-500);\n  --info-soft: var(--blue-50);\n\n  /* --- Semantic aliases --- */\n  --bg-app: var(--cloud-white);\n  --surface-card: var(--white);\n  --surface-sunken: var(--slate-100);\n  --surface-inverse: var(--slate-900);\n\n  --border-subtle: var(--slate-200);\n  --border-default: var(--slate-300);\n  --border-strong: var(--slate-400);\n\n  --text-strong: var(--slate-900);\n  --text-body: var(--slate-800);\n  --text-muted: var(--slate-500);\n  --text-faint: var(--slate-400);\n  --text-on-brand: #FFFFFF;\n  --text-on-inverse: var(--slate-100);\n\n  --brand: var(--digital-cobalt);\n  --brand-hover: var(--blue-600);\n  --brand-active: var(--blue-700);\n  --brand-soft: var(--blue-50);\n  --brand-ring: color-mix(in srgb, var(--digital-cobalt) 32%, transparent);\n  --link: var(--digital-cobalt);\n  --link-hover: var(--blue-700);\n}\n\n/* Milinkadigi — Typography tokens.\n   Space Grotesk for headings (geometric, precise).\n   Plus Jakarta Sans for body (clean, airy).\n   JetBrains Mono for code/numeric detail. */\n:root {\n  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;\n  --font-body: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* Type scale (1.25 major-third-ish, tuned) */\n  --text-2xs: 0.6875rem;  /* 11px */\n  --text-xs:  0.75rem;    /* 12px */\n  --text-sm:  0.875rem;   /* 14px */\n  --text-base:1rem;       /* 16px */\n  --text-lg:  1.125rem;   /* 18px */\n  --text-xl:  1.375rem;   /* 22px */\n  --text-2xl: 1.75rem;    /* 28px */\n  --text-3xl: 2.25rem;    /* 36px */\n  --text-4xl: 3rem;       /* 48px */\n  --text-5xl: 4rem;       /* 64px */\n  --text-6xl: 5.25rem;    /* 84px */\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n\n  --leading-tight: 1.08;\n  --leading-snug: 1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.7;\n\n  --tracking-tight: -0.03em;\n  --tracking-snug: -0.015em;\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;\n  --tracking-caps: 0.12em;   /* for uppercase eyebrows/labels */\n}\n\n/* Milinkadigi — Spacing, radius, shadow, motion, layout tokens. */\n:root {\n  /* Spacing — 4px base grid */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 3rem;      /* 48 */\n  --space-8: 4rem;      /* 64 */\n  --space-9: 6rem;      /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Radius — soft, generous corners for a friendly-but-precise feel */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-2xl: 32px;\n  --radius-pill: 999px;\n\n  /* Border widths */\n  --border-hair: 1px;\n  --border-thick: 1.5px;\n\n  /* Shadows — cool, soft, low-contrast. Tinted with slate, never pure black. */\n  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.06);\n  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);\n  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);\n  --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.10), 0 4px 8px rgba(15, 23, 42, 0.05);\n  --shadow-xl: 0 24px 56px rgba(15, 23, 42, 0.14), 0 8px 16px rgba(15, 23, 42, 0.06);\n  --shadow-brand: 0 8px 24px rgba(0, 82, 255, 0.24);\n  --shadow-focus: 0 0 0 3px var(--brand-ring);\n\n  /* Motion — quick, calm, no bounce */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 180ms; /* @kind other */\n  --dur-slow: 280ms; /* @kind other */\n\n  /* Layout */\n  --container-sm: 640px;\n  --container-md: 820px;\n  --container-lg: 1080px;\n  --container-xl: 1200px;\n}\n\n/* Milinkadigi — base element defaults + a few utility helpers.\n   Kept minimal; components own their own styling. */\n:root {\n  color-scheme: light;\n}\nbody {\n  margin: 0;\n  background: var(--bg-app);\n  color: var(--text-body);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  font-weight: var(--weight-bold);\n  margin: 0;\n  text-wrap: balance;\n}\np { text-wrap: pretty; }\na {\n  color: var(--link);\n  text-decoration: none;\n  transition: color var(--dur-fast) var(--ease-standard);\n}\na:hover { color: var(--link-hover); }\ncode, kbd, pre { font-family: var(--font-mono); }\n::selection { background: var(--blue-200); color: var(--slate-900); }\n\n/* Uppercase eyebrow / label helper used across the brand */\n.md-eyebrow {\n  font-family: var(--font-body);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--brand);\n}\n\n<\u002Fstyle>\n<script src=\"358fb88a-9867-408f-bf77-586b157fbf06\"><\u002Fscript>\n<script src=\"2d71e98a-abd3-4cb6-a4e4-b3ea89d8681d\"><\u002Fscript>\n<script src=\"92d32e0e-3572-432d-9f23-1568f5012e9d\"><\u002Fscript>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<style>\n  body { margin: 0; background: var(--bg-app); }\n  a { color: var(--link); text-decoration: none; }\n  a:hover { color: var(--link-hover); }\n  .navlink { cursor: pointer; font-size: 15px; font-weight: 500; transition: color 160ms ease; }\n  .navlink:hover { color: var(--brand); }\n  .pcard { transition: transform 220ms ease, box-shadow 220ms ease; }\n  .pcard:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }\n  .pcard:hover .pshot { transform: scale(1.03); }\n  .pshot { transition: transform 500ms ease; }\n  .btn-primary { display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:600; color:#fff; background:var(--brand); padding:13px 24px; border-radius:10px; box-shadow:var(--shadow-brand); cursor:pointer; transition:background 160ms ease, transform 120ms ease; }\n  .btn-primary:hover { background:var(--brand-hover); color:#fff; }\n  .btn-primary:active { transform:scale(0.97); }\n  .btn-ghost { display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:600; color:var(--slate-700); background:var(--surface-card); border:1px solid var(--border-default); padding:12px 22px; border-radius:10px; cursor:pointer; box-shadow:var(--shadow-xs); transition:background 160ms ease, transform 120ms ease; }\n  .btn-ghost:hover { background:var(--slate-50); color:var(--slate-900); }\n  .btn-ghost:active { transform:scale(0.97); }\n  .btn-white { display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:600; color:var(--brand); background:#fff; padding:13px 26px; border-radius:10px; cursor:pointer; box-shadow:var(--shadow-md); transition:transform 120ms ease, background 160ms ease; }\n  .btn-white:hover { color:var(--brand); background:var(--slate-50); }\n  .btn-white:active { transform:scale(0.97); }\n  .nav-burger { display:none; align-items:center; justify-content:center; flex-direction:column; gap:5px; width:40px; height:40px; background:none; border:none; cursor:pointer; padding:0; }\n  .nav-burger span { width:22px; height:2px; background:var(--slate-900); border-radius:2px; }\n  .whycard { background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; box-shadow:var(--shadow-xs); padding:28px 26px; transition:transform 200ms ease, box-shadow 200ms ease; }\n  .whycard:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }\n  .fadein { animation: fadeUp 620ms cubic-bezier(.22,.61,.36,1) both; }\n  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }\n  .reveal { opacity:0; transform:translateY(26px); transition:opacity 720ms ease, transform 720ms cubic-bezier(.22,.61,.36,1); }\n  .reveal.reveal-in { opacity:1; transform:none; }\n  .beliefcard { background:var(--white); border:1px solid var(--border-subtle); border-radius:20px; box-shadow:var(--shadow-xs); padding:32px 30px; transition:transform 220ms ease, box-shadow 220ms ease; }\n  .beliefcard:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); }\n  .factcard { background:var(--white); border:1px solid var(--border-subtle); border-radius:999px; box-shadow:var(--shadow-xs); padding:18px 26px; display:flex; align-items:center; gap:15px; transition:transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease; }\n  .factcard:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:color-mix(in srgb, var(--brand) 32%, transparent); }\n  .procrow { transition:transform 200ms ease; }\n  .procrow:hover { transform:translateX(4px); }\n  .dodcard { transition: transform 240ms ease-out, box-shadow 240ms ease-out; }\n  .dodcard:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }\n  .heroshot { box-shadow: 0 30px 60px -18px rgba(15,23,42,0.32), 0 8px 20px -8px rgba(15,23,42,0.18); }\n  @media (max-width:960px) {\n    .hero-grid { grid-template-columns:1fr !important; gap:44px !important; padding-top:52px !important; padding-bottom:20px !important; }\n    .hero-visual { order:-1; }\n  }\n  @media (max-width:860px) {\n    .nav-desktop { display:none !important; }\n    .nav-burger { display:flex !important; }\n    main section, header > div, footer > div, .band-inner { padding-left:20px !important; padding-right:20px !important; }\n    .grid-3, .grid-2, .grid-4, .split, .proc-grid, .belief-grid, .fact-grid, .onama-hero { grid-template-columns:1fr !important; }\n    .onama-hero { gap:36px !important; }\n    .onama-hero .onama-portrait { order:-1; }\n    .split { gap:36px !important; padding-top:52px !important; padding-bottom:64px !important; }\n    .hero-h1 { font-size:39px !important; }\n    .page-h1 { font-size:34px !important; }\n    .stats-row { flex-wrap:wrap; gap:24px !important; }\n    .band-h { font-size:32px !important; }\n    .sec-h { font-size:28px !important; }\n    .story-lead { font-size:20px !important; }\n    .story-h { font-size:30px !important; }\n    .onama-h1 { font-size:38px !important; }\n    .cta-h { font-size:32px !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:var(--font-body); color:var(--text-body); min-height:100vh; display:flex; flex-direction:column;\">\n\n  <!-- ============ NAV ============ -->\n  <header style=\"position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg-app) 90%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border-subtle);\">\n    <div style=\"max-width:1120px; margin:0 auto; padding:18px 32px; display:flex; align-items:center; justify-content:space-between; gap:20px;\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"font-family:var(--font-display); font-size:21px; font-weight:700; letter-spacing:-0.03em; color:var(--slate-900); cursor:pointer;\">milinkadigi<span style=\"color:var(--brand);\">/<\u002Fspan><\u002Fdiv>\n      <nav class=\"nav-desktop\" style=\"display:flex; align-items:center; gap:32px;\">\n        <span class=\"navlink\" sc-camel-on-click=\"{{ goHome }}\" style=\"color:{{ navHome }};\">Početna<\u002Fspan>\n        <span class=\"navlink\" sc-camel-on-click=\"{{ goProjekti }}\" style=\"color:{{ navProjekti }};\">Projekti<\u002Fspan>\n        <div style=\"position:relative;\">\n          <span class=\"navlink\" sc-camel-on-click=\"{{ toggleWhy }}\" style=\"display:inline-flex; align-items:center; gap:5px; color:{{ navWhy }};\">Zašto sajt <i data-lucide=\"chevron-down\" style=\"width:15px;height:15px;\"><\u002Fi><\u002Fspan>\n          <sc-if value=\"{{ whyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; top:calc(100% + 16px); left:-12px; width:340px; background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; box-shadow:var(--shadow-lg); padding:8px; display:flex; flex-direction:column; gap:2px;\">\n            <sc-for list=\"{{ whyTopics }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div class=\"navlink\" sc-camel-on-click=\"{{ t.go }}\" style-hover=\"background:var(--brand-soft);\" style=\"display:flex; gap:12px; align-items:flex-start; padding:12px 12px; border-radius:11px; transition:background 140ms ease;\">\n                <span style=\"display:inline-flex; width:38px; height:38px; flex-shrink:0; border-radius:10px; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center;\"><i data-lucide=\"{{ t.icon }}\" style=\"width:19px;height:19px;\"><\u002Fi><\u002Fspan>\n                <span>\n                  <span style=\"display:block; font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--slate-900); letter-spacing:-0.01em;\">{{ t.title }}<\u002Fspan>\n                  <span style=\"display:block; font-size:12.5px; line-height:1.45; color:var(--text-muted); margin-top:2px; font-weight:400;\">{{ t.desc }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <span class=\"navlink\" sc-camel-on-click=\"{{ goCenovnik }}\" style=\"color:{{ navCenovnik }};\">Cenovnik<\u002Fspan>\n        <span class=\"navlink\" sc-camel-on-click=\"{{ goOnama }}\" style=\"color:{{ navOnama }};\">O meni<\u002Fspan>\n        <a class=\"btn-primary\" style=\"padding:9px 18px; font-size:14px;\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži razgovor<\u002Fa>\n      <\u002Fnav>\n      <button class=\"nav-burger\" sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Meni\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border-top:1px solid var(--border-subtle); padding:6px 20px 14px; display:flex; flex-direction:column;\">\n      <span class=\"navlink\" sc-camel-on-click=\"{{ goHome }}\" style=\"color:{{ navHome }}; padding:14px 0; border-bottom:1px solid var(--border-subtle);\">Početna<\u002Fspan>\n      <span class=\"navlink\" sc-camel-on-click=\"{{ goProjekti }}\" style=\"color:{{ navProjekti }}; padding:14px 0; border-bottom:1px solid var(--border-subtle);\">Projekti<\u002Fspan>\n      <div style=\"font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); padding:16px 0 8px;\">Zašto sajt<\u002Fdiv>\n      <sc-for list=\"{{ whyTopics }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <span class=\"navlink\" sc-camel-on-click=\"{{ t.go }}\" style=\"display:flex; gap:10px; align-items:center; color:var(--slate-700); padding:11px 0; border-bottom:1px solid var(--border-subtle);\"><i data-lucide=\"{{ t.icon }}\" style=\"width:17px;height:17px;color:var(--brand);\"><\u002Fi> {{ t.title }}<\u002Fspan>\n      <\u002Fsc-for>\n      <span class=\"navlink\" sc-camel-on-click=\"{{ goCenovnik }}\" style=\"color:{{ navCenovnik }}; padding:14px 0; border-bottom:1px solid var(--border-subtle);\">Cenovnik<\u002Fspan>\n      <span class=\"navlink\" sc-camel-on-click=\"{{ goOnama }}\" style=\"color:{{ navOnama }}; padding:14px 0; border-bottom:1px solid var(--border-subtle);\">O meni<\u002Fspan>\n      <a class=\"btn-primary\" style=\"margin-top:14px; justify-content:center;\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži razgovor<\u002Fa>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <main style=\"flex:1;\">\n\n    <!-- ================= HOME ================= -->\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <!-- HERO -->\n      <section class=\"hero-grid\" style=\"max-width:1120px; margin:0 auto; padding:84px 32px 68px; display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center;\">\n        <div class=\"fadein\">\n          <div style=\"display:inline-flex; align-items:center; gap:8px; background:var(--brand-soft); color:var(--brand); font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; margin-bottom:22px;\"><span style=\"width:7px; height:7px; border-radius:50%; background:var(--brand);\"><\u002Fspan> Izrada sajtova za male biznise<\u002Fdiv>\n          <h1 class=\"hero-h1\" style=\"font-family:var(--font-display); font-size:58px; line-height:1.03; letter-spacing:-0.035em; color:var(--slate-900); margin:0 0 22px; text-wrap:balance;\">Znaju da postojiš. Da li znaju šta tačno nudiš?<\u002Fh1>\n          <p style=\"font-size:19px; line-height:1.6; color:var(--text-muted); max-width:520px; margin:0 0 32px;\">Ti i ja napravićemo sajt koji će tvom novom klijentu jasno reći čime se baviš, šta nudiš i kako da dođe do tebe.<\u002Fp>\n          <div style=\"display:flex; gap:12px; flex-wrap:wrap; margin-bottom:26px;\">\n            <a class=\"btn-primary\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži besplatan razgovor <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fa>\n            <a class=\"btn-ghost\" sc-camel-on-click=\"{{ goProjekti }}\">Pogledaj radove<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hero-visual fadein\" style=\"position:relative; min-height:400px; display:flex; justify-content:center; align-items:center;\">\n          <div style=\"position:relative; width:88%; aspect-ratio:16/11;\">\n            <sc-for list=\"{{ heroStack }}\" as=\"card\" hint-placeholder-count=\"4\">\n              <div style=\"{{ card.style }}\">\n                <div style=\"display:flex; align-items:center; gap:6px; padding:9px 12px; background:var(--slate-100); border-bottom:1px solid var(--border-subtle);\"><span style=\"width:9px;height:9px;border-radius:50%;background:#E2554F;\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:#E9B84B;\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:#5BB863;\"><\u002Fspan><span style=\"margin-left:8px; font-family:var(--font-mono); font-size:10px; color:var(--slate-400); background:#fff; padding:2px 10px; border-radius:5px; max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ card.url }}<\u002Fspan><\u002Fdiv>\n                <div style=\"position:relative; flex:1; overflow:hidden;\">\n                  <img src=\"{{ card.img }}\" alt=\"{{ card.title }}\" loading=\"{{ card.loading }}\" decoding=\"async\" style=\"width:100%; height:100%; object-fit:cover; object-position:top center; display:block;\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ZAŠTO SAJT -->\n      <section style=\"background:var(--white); border-top:1px solid var(--border-subtle); border-bottom:1px solid var(--border-subtle);\">\n      <div class=\"band-inner\" style=\"max-width:1120px; margin:0 auto; padding:92px 32px 96px;\">\n        <div style=\"max-width:640px; margin-bottom:44px;\">\n          <div class=\"md-eyebrow\" style=\"margin-bottom:14px;\">Zašto sajt<\u002Fdiv>\n          <h2 class=\"sec-h\" style=\"font-family:var(--font-display); font-size:38px; line-height:1.08; letter-spacing:-0.03em; color:var(--slate-900); margin:0 0 16px; text-wrap:balance;\">Ako te nema na internetu, mušterija zove nekog drugog.<\u002Fh2>\n          <p style=\"font-size:18px; line-height:1.6; color:var(--text-muted); margin:0;\">Mali biznis ne treba sajt zato što je moderno. Treba ga zato što ljudi tako biraju kome će dati novac. Evo šta sajt konkretno radi za tebe.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"grid-4\" style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:20px;\">\n          <div class=\"whycard\" sc-camel-on-click=\"{{ goBlogGuglaju }}\" style=\"cursor:pointer; display:flex; flex-direction:column;\">\n            <span style=\"display:inline-flex; width:44px; height:44px; border-radius:11px; background:var(--brand-soft); color:var(--brand); align-items:center; justify-content:center; margin-bottom:18px;\"><i data-lucide=\"search\" style=\"width:22px;height:22px;\"><\u002Fi><\u002Fspan>\n            <h3 style=\"font-family:var(--font-display); font-size:18px; letter-spacing:-0.02em; color:var(--slate-900); margin:0 0 8px;\">Prvo te guglaju<\u002Fh3>\n            <p style=\"font-size:14.5px; line-height:1.6; color:var(--text-muted); margin:0 0 16px;\">Pre nego što pozovu, ukucaju tvoje ime. <b>Ako te nema odlaze kod konkurencije.<\u002Fb><\u002Fp>\n            <span style=\"margin-top:auto; display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; color:var(--brand);\">Saznaj više <i data-lucide=\"arrow-right\" style=\"width:15px;height:15px;\"><\u002Fi><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"whycard\" sc-camel-on-click=\"{{ goBlogInstagram }}\" style=\"cursor:pointer; display:flex; flex-direction:column;\">\n            <span style=\"display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 14px; border-radius:11px; background:var(--brand-soft); color:var(--brand); margin-bottom:18px;\">\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\" aria-label=\"Facebook\"><path d=\"M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.89v2.25h3.32l-.53 3.49h-2.79V24C19.61 23.1 24 18.1 24 12.07z\"><\u002Fpath><\u002Fsvg>\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\" aria-label=\"Instagram\"><path d=\"M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.3
