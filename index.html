r:var(--brand); align-items:center; justify-content:center;\"><i data-lucide=\"rocket\" style=\"width:21px;height:21px;\"><\u002Fi><\u002Fspan>\n            <span style=\"font-family:var(--font-display); font-size:20px; letter-spacing:-0.02em; color:var(--slate-900);\">Objava sajta<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SECTION 5 — NEKOLIKO STVARI O MENI -->\n      <section style=\"max-width:1120px; margin:0 auto; padding:88px 32px 84px;\">\n        <div class=\"reveal\" style=\"margin-bottom:44px;\">\n          <div class=\"md-eyebrow\" style=\"margin-bottom:14px;\">Nekoliko stvari o meni<\u002Fdiv>\n          <h2 class=\"sec-h\" style=\"font-family:var(--font-display); font-size:36px; line-height:1.1; letter-spacing:-0.03em; color:var(--slate-900); margin:0;\">Van posla<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"fact-grid\" style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:16px;\">\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">☕<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Obožavam kafu.<\u002Fspan><\u002Fdiv>\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">🎥<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Radim i UGC videe.<\u002Fspan><\u002Fdiv>\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">🤖<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Volim AI alate.<\u002Fspan><\u002Fdiv>\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">📚<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Neprestano učim.<\u002Fspan><\u002Fdiv>\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">💡<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Verujem da jednostavna rešenja daju najbolje rezultate.<\u002Fspan><\u002Fdiv>\n          <div class=\"factcard reveal\"><span style=\"font-size:24px; line-height:1;\">🎯<\u002Fspan><span style=\"font-size:16.5px; color:var(--slate-800); font-weight:500;\">Najviše volim da radim sa malim lokalnim biznisima.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SECTION 6 — CTA -->\n      <section style=\"background:var(--surface-inverse);\">\n        <div class=\"reveal\" style=\"max-width:720px; margin:0 auto; padding:96px 32px 104px; text-align:center;\">\n          <h2 class=\"cta-h\" style=\"font-family:var(--font-display); font-size:40px; line-height:1.1; letter-spacing:-0.03em; color:#fff; margin:0 auto 20px; max-width:600px; text-wrap:balance;\">Hajde da pokažemo sve što tvoj biznis nudi.<\u002Fh2>\n          <p style=\"font-size:18px; line-height:1.65; color:var(--slate-300); margin:0 auto 34px; max-width:520px;\">Ako imaš osećaj da ljudi ne razumeju dovoljno jasno tvoje usluge, volela bih da popričamo.<\u002Fp>\n          <a class=\"btn-white\" sc-camel-on-click=\"{{ goUpit }}\">Zakaži besplatan razgovor <i data-lucide=\"arrow-right\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n\n  <\u002Fmain>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"background:var(--surface-inverse); color:var(--text-on-inverse); margin-top:auto;\">\n    <div style=\"max-width:1120px; margin:0 auto; padding:56px 32px 40px; display:flex; flex-wrap:wrap; gap:40px; justify-content:space-between; align-items:start;\">\n      <div style=\"max-width:320px;\">\n        <div style=\"font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:-0.03em; color:#fff; margin-bottom:12px;\">milinkadigi<span style=\"color:var(--blue-300);\">/<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:14.5px; line-height:1.65; color:var(--slate-400); margin:0;\">Izrada sajtova i digitalnog sadržaja za male biznise i brendove.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:56px; flex-wrap:wrap;\">\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--slate-500); margin-bottom:4px;\">Sajt<\u002Fdiv>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goHome }}\" style=\"color:var(--slate-300);\">Početna<\u002Fspan>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goProjekti }}\" style=\"color:var(--slate-300);\">Projekti<\u002Fspan>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goCenovnik }}\" style=\"color:var(--slate-300);\">Cenovnik<\u002Fspan>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goOnama }}\" style=\"color:var(--slate-300);\">O meni<\u002Fspan>\n          <span class=\"navlink\" sc-camel-on-click=\"{{ goUpit }}\" style=\"color:var(--slate-300);\">Kontakt<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--slate-500); margin-bottom:4px;\">Prati<\u002Fdiv>\n          <a href=\"https://www.instagram.com/barnakmilinka/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--slate-300);\">Instagram<\u002Fa>\n          <a href=\"https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=barnakmilinka@gmail.com&amp;su=Upit%20sa%20sajta\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ onCopyEmail }}\" style=\"color:var(--slate-300);\">Email<\u002Fa>\n          <a href=\"https://wa.me/38166363087\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--slate-300);\">WhatsApp<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1120px; margin:0 auto; padding:20px 32px; border-top:1px solid rgba(255,25
