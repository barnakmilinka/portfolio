    // asking the direct parent over the relay protocol above. An

    // degraded state as a refused embed.

        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {

        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

icode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5746ee52-fa5c-467c-a0b9-08312290a56d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* Milinkadigi — Color tokens. Soft Blue Minimalism.\n   Base palette from the visual identity guide, extended with a tonal\n   blue ramp and neutral slate ramp for real UI needs. */\n:root {\n  /* --- Brand base (from guide) --- */\n  --cloud-white: #F8FAFC;   /* Pozadina — very light gray-blue, easy on the eyes */\n  --digital-cobalt: #0052FF; /* Dominantna — strong, vibrant blue accent */\n  --slate-dark: #1E293B;     /* Tekst — dark slate instead of pure black */\n  --soft-gray: #E2E8F0;      /* Akcenat — light gray for detail */\n\n  /* --- Blue ramp (built around Digital Cobalt) --- */\n  --blue-50:  #EBF1FF;\n  --blue-100: #D6E3FF;\n  --blue-200: #ADC6FF;\n  --blue-300: #7FA3FF;\n  --blue-400: #4A78FF;\n  --blue-500: #0052FF;  /* = Digital Cobalt */\n  --blue-600: #0042CC;\n  --blue-700: #00329B;\n  --blue-800: #04246B;\n  --blue-900: #071A4A;\n\n  /* --- Slate neutral ramp --- */\n  --slate-50:  #F8FAFC;  /* = Cloud White */\n  --slate-100: #F1F5F9;\n  --slate-200: #E2E8F0;  /* = Soft Gray */\n  --slate-300: #CBD5E1;\n  --slate-400: #94A3B8;\n  --slate-500: #64748B;\n  --slate-600: #475569;\n  --slate-700: #334155;\n  --slate-800: #1E293B;  /* = Slate Dark */\n  --slate-900: #0F172A;\n  --white: #FFFFFF;\n\n  /* --- Semantic status (kept in the cool/desaturated family) --- */\n  --success: #0EA371;\n  --success-soft: #DFF5EC;\n  --warning: #C77A00;\n  --warning-soft: #FBEDD6;\n  --danger: #E5484D;\n  --danger-soft: #FBE4E5;\n  --info: var(--blue-500);\n  --info-soft: var(--blue-50);\n\n  /* --- Semantic aliases --- */\n  --bg-app: var(--cloud-white);\n  --surface-card: var(--white);\n  --surface-sunken: var(--slate-100);\n  --surface-inverse: var(--slate-900);\n\n  --border-subtle: var(--slate-200);\n  --border-default: var(--slate-300);\n  --border-strong: var(--slate-400);\n\n  --text-strong: var(--slate-900);\n  --text-body: var(--slate-800);\n  --text-muted: var(--slate-500);\n  --text-faint: var(--slate-400);\n  --text-on-brand: #FFFFFF;\n  --text-on-inverse: var(--slate-100);\n\n  --brand: var(--digital-cobalt);\n  --brand-hover: var(--blue-600);\n  --brand-active: var(--blue-700);\n  --brand-soft: var(--blue-50);\n  --brand-ring: color-mix(in srgb, var(--digital-cobalt) 32%, transparent);\n  --link: var(--digital-cobalt);\n  --link-hover: var(--blue-700);\n}\n<\u002Fstyle>\n<style>/* Milinkadigi — Typography tokens.\n   Space Grotesk for headings (geometric, precise).\n   Plus Jakarta Sans for body (clean, airy).\n   JetBrains Mono for code/numeric detail. */\n:root {\n  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;\n  --font-body: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* Type scale (1.25 major-third-ish, tuned) */\n  --text-2xs: 0.6875rem;  /* 11px */\n  --text-xs:  0.75rem;    /* 12px */\n  --text-sm:  0.875rem;   /* 14px */\n  --text-base:1rem;       /* 16px */\n  --text-lg:  1.125rem;   /* 18px */\n  --text-xl:  1.375rem;   /* 22px */\n  --text-2xl: 1.75rem;    /* 28px */\n  --text-3xl: 2.25rem;    /* 36px */\n  --text-4xl: 3rem;       /* 48px */\n  --text-5xl: 4rem;       /* 64px */\n  --text-6xl: 5.25rem;    /* 84px */\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n\n  --leading-tight: 1.08;\n  --leading-snug: 1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.7;\n\n  --tracking-tight: -0.03em;\n  --tracking-snug: -0.015em;\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;\n  --tracking-caps: 0.12em;   /* for uppercase eyebrows/labels */\n}\n<\u002Fstyle>\n<style>/* Milinkadigi — Spacing, radius, shadow, motion, layout tokens. */\n:root {\n  /* Spacing — 4px base grid */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 3rem;      /* 48 */\n  --space-8: 4rem;      /* 64 */\n  --space-9: 6rem;      /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Radius — soft, generous corners for a friendly-but-precise feel */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-2xl: 32px;\n  --radius-pill: 999px;\n\n  /* Border widths */\n  --border-hair: 1px;\n  --border-thick: 1.5px;\n\n  /* Shadows — cool, soft, low-contrast. Tinted with slate, never pure black. */\n  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.06);\n  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);\n  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);\n  --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.10), 0 4px 8px rgba(15, 23, 42, 0.05);\n  --shadow-xl: 0 24px 56px rgba(15, 23, 42, 0.14), 0 8px 16px rgba(15, 23, 42, 0.06);\n  --shadow-brand: 0 8px 24px rgba(0, 82, 255, 0.24);\n  --shadow-focus: 0 0 0 3px var(--brand-ring);\n\n  /* Motion — quick, calm, no bounce */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 180ms; /* @kind other */\n  --dur-slow: 280ms; /* @kind other */\n\n  /* Layout */\n  --container-sm: 640px;\n  --container-md: 820px;\n  --container-lg: 1080px;\n  --container-xl: 1200px;\n}\n<\u002Fstyle>\n<style>/* Milinkadigi — base element defaults + a few utility helpers.\n   Kept minimal; components own their own styling. */\n:root {\n  color-scheme: light;\n}\nbody {\n  margin: 0;\n  background: var(--bg-app);\n  color: var(--text-body);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  font-weight: var(--weight-bold);\n  margin: 0;\n  text-wrap: balance;\n}\np { text-wrap: pretty; }\na {\n  color: var(--link);\n  text-decoration: none;\n  transition: color var(--dur-fast) var(--ease-standard);\n}\na:hover { color: var(--link-hover); }\ncode, kbd, pre { font-family: var(--font-mono); }\n::selection { background: var(--blue-200); color: var(--slate-900); }\n\n/* Uppercase eyebrow / label helper used across the brand */\n.md-eyebrow {\n  font-family: var(--font-body);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--brand);\n}\n<\u002Fstyle>\n<style>/* Milinkadigi Design System — global entry point.\n   Consumers link THIS file only. Import order matters: fonts, then tokens. */\n/* Milinkadigi — Webfonts.\n   Both are the brand's intended typefaces per the identity guide, and both\n   ship as Google Fonts. Loaded from the Google Fonts CDN (no substitution). */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3632b48c-f7ef-45f3-9a0f-f2a619f6d65e\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n \n  font-display: swap;\n  src: url(\"4167b1af-4842-4930-b347-56864f1ca39b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b730a76c-20ba-4530-b141-26fc3e8260e1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5746ee52-fa5c-467c-a0b9-08312290a56d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Milinkadigi — Color tokens. Soft Blue Minimalism.\n   Base palette from the visual identity guide, extended with a tonal\n   blue ramp and neutral slate ramp for real UI needs. */\n:root {\n  /* --- Brand base (from guide) --- */\n  --cloud-white: #F8FAFC;   /* Pozadina — very light gray-blue, easy on the eyes */\n  --digital-cobalt: #0052FF; /* Dominantna — strong, vibrant blue accent */\n  --slate-dark: #1E293B;     /* Tekst — dark slate instead of pure black */\n  --soft-gray: #E2E8F0;      /* Akcenat — light gray for detail */\n\n  /* --- Blue ramp (built around Digital Cobalt) --- */\n  --blue-50:  #EBF1FF;\n  --blue-100: #D6E3FF;\n  --blue-200: #ADC6FF;\n  --blue-300: #7FA3FF;\n  --blue-400: #4A78FF;\n  --blue-500: #0052FF;  /* = Digital Cobalt */\n  --blue-600: #0042CC;\n  --blue-700: #00329B;\n  --blue-800: #04246B;\n  --blue-900: #071A4A;\n\n  /* --- Slate neutral ramp --- */\n  --slate-50:  #F8FAFC;  /* = Cloud White */\n  --slate-100: #F1F5F9;\n  --slate-200: #E2E8F0;  /* = Soft Gray */\n  --slate-300: #CBD5E1;\n  --slate-400: #94A3B8;\n  --slate-500: #64748B;\n  --slate-600: #475569;\n  --slate-700: #334155;\n  --slate-800: #1E293B;  /* = Slate Dark */\n  --slate-900: #0F172A;\n  --white: #FFFFFF;\n\n  /* --- Semantic status (kept in the cool/desaturated family) --- */\n  --success: #0EA371;\n  --success-soft: #DFF5EC;\n  --warning: #C77A00;\n  --warning-soft: #FBEDD6;\n  --danger: #E5484D;\n  --danger-soft: #FBE4E5;\n  --info: var(--blue-500);\n  --info-soft: var(--blue-50);\n\n  /* --- Semantic aliases --- */\n  --bg-app: var(--cloud-white);\n  --surface-card: var(--white);\n  --surface-sunken: var(--slate-100);\n  --surface-inverse: var(--slate-900);\n\n  --border-subtle: var(--slate-200);\n  --border-default: var(--slate-300);\n  --border-strong: var(--slate-400);\n\n  --text-strong: var(--slate-900);\n  --text-body: var(--slate-800);\n  --text-muted: var(--slate-500);\n  --text-faint: var(--slate-400);\n  --text-on-brand: #FFFFFF;\n  --text-on-inverse: var(--slate-100);\n\n  --brand: var(--digital-cobalt);\n  --brand-hover: var(--blue-600);\n  --brand-active: var(--blue-700);\n  --brand-soft: var(--blue-50);\n  --brand-ring: color-mix(in srgb, var(--digital-cobalt) 32%, transparent);\n  --link: var(--digital-cobalt);\n  --link-hover: var(--blue-700);\n}\n\n/* Milinkadigi — Typography tokens.\n   Space Grotesk for headings (geometric, precise).\n   Plus Jakarta Sans for body (clean, airy).\n   JetBrains Mono for code/numeric detail. */\n:root {\n  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;\n  --font-body: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* Type scale (1.25 major-third-ish, tuned) */\n  --text-2xs: 0.6875rem;  /* 11px */\n  --text-xs:  0.75rem;    /* 12px */\n  --text-sm:  0.875rem;   /* 14px */\n  --text-base:1rem;       /* 16px */\n  --text-lg:  1.125rem;   /* 18px */\n  --text-xl:  1.375rem;   /* 22px */\n  --text-2xl: 1.75rem;    /* 28px */\n  --text-3xl: 2.25rem;    /* 36px */\n  --text-4xl: 3rem;       /* 48px */\n  --text-5xl: 4rem;       /* 64px */\n  --text-6xl: 5.25rem;    /* 84px */\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n\n  --leading-tight: 1.08;\n  --leading-snug: 1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.7;\n\n  --tracking-tight: -0.03em;\n  --tracking-snug: -0.015em;\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;\n  --tracking-caps: 0.12em;   /* for uppercase eyebrows/labels */\n}\n\n/* Milinkadigi — Spacing, radius, shadow, motion, layout tokens. */\n:root {\n  /* Spacing — 4px base grid */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 3rem;      /* 48 */\n  --space-8: 4rem;      /* 64 */\n  --space-9: 6rem;      /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Radius — soft, generous corners for a friendly-but-precise feel */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-2xl: 32px;\n  --radius-pill: 999px;\n\n  /* Border widths */\n  --border-hair: 1px;\n  --border-thick: 1.5px;\n\n  /* Shadows — cool, soft, low-contrast. Tinted with slate, never pure black. */\n  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.06);\n  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);\n  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);\n  --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.10), 0 4px 8px rgba(15, 23, 42, 0.05);\n  --shadow-xl: 0 24px 56px rgba(15, 23, 42, 0.14), 0 8px 16px rgba(15, 23, 42, 0.06);\n  --shadow-brand: 0 8px 24px rgba(0, 82, 255, 0.24);\n  --shadow-focus: 0 0 0 3px var(--brand-ring);\n\n  /* Motion — quick, calm, no bounce */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 180ms; /* @kind other */\n  --dur-slow: 280ms; /* @kind other */\n\n  /* Layout */\n  --container-sm: 640px;\n  --container-md: 820px;\n  --container-lg: 1080px;\n  --container-xl: 1200px;\n}\n\n/* Milinkadigi — base element defaults + a few utility helpers.\n   Kept minimal; components own their own styling. */\n:root {\n  color-scheme: light;\n}\nbody {\n  margin: 0;\n  background: var(--bg-app);\n  color: var(--text-body);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  font-weight: var(--weight-bold);\n  margin: 0;\n  text-wrap: balance;\n}\np { text-wrap: pretty; }\na {\n  color: var(--link);\n  text-decoration: none;\n  transition: color var(--dur-fast) var(--ease-standard);\n}\na:hover { color: var(--link-hover); }\ncode, kbd, pre { font-family: var(--font-mono); }\n::selection { background: var(--blue-200); color: var(--slate-900); }\n\n/* Uppercase eyebrow / label helper used across the brand */\n.md-eyebrow {\n  font-family: var(--font-body);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--brand);\n}\n\n<\u002Fstyle>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<script src=\"4275b132-7bea-4011-9059-1b30213013e2\"><\u002Fscript>\n<script src=\"61ed49c7-1bea-4281-883a-e5ad13f05641\"><\u002Fscript>\n<script src=\"7f47b60e-06 direction:column; gap:5px; width:40px; height:40px; background:none; border:none; cursor:pointer; padding:0; }\n  .nav-burger span { width:22px; height:2px; background:var(--slate-900); border-radius:2px; }\n  .whycard { background:var(--white); border:1px solid var(--border-subtle); border-radius:16px; box-shadow:var(--shadow-xs); padding:28px 26px; transition:transform 200ms ease, box-shadow 200ms ease; }\n  .whycard:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }\n  .fadein { animation: fadeUp 620ms cubic-bezier(.22,.61,.36,1) both; }\n  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }\n  .reveal { opacity:0; transform:translateY(26px); transition:opacity 720ms ease, transform 720ms cubic-bezier(.22,.61,.36,1); }\n  .reveal.reveal-in { opacity:1; transform:none; }\n  .beliefcard { background:var(--white); border:1px solid var(--border-subtle); border-radius:20px; box-shadow:var(--shadow-xs); padding:32px 30px; transition:transform 220ms ease, box-shadow 220ms ease; }\n  .beliefcard:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); }\n  .factcard { background:var(--white); border:1px solid var(--border-subtle); border-radius:999px; box-shadow:var(--shadow-xs); padding:18px 26px; display:flex; align-items:center; gap:15px; transition:transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease; }\n  .factcard:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:color-mix(in srgb, var(--brand) 32%, transparent); }\n  .procrow { transition:transform 200ms ease; }\n  .procrow:hover { transform:translateX(4px); }\n  .dodcard { transition: transform 240ms ease-out, box-shadow 240ms ease-out; }\n  .dodcard:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }\n  .upit-grid input, .upit-grid select, .upit-grid textarea { box-sizing:border-box; width:100%; max-width:100%; }\n  .heroshot { box-shadow: 0 30px 60px -18px rgba(15,23,42,0.32),
